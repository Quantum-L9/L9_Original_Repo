default_language_version:
  python: python3.12

# Global exclude for archived folders
exclude: "(_archived|_archived_|.backup|_pack_staging|codegen)"

repos:
  # Python formatters
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # NOTE: black removed - ruff-format handles formatting

  # Python type checking
  # NOTE: mypy disabled in pre-commit until ADR-XXXX type coverage initiative completes
  # Run manually: mypy --config-file pyproject.toml .
  # Current status: 1369 errors in 325 files need fixing
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.14.1
  #   hooks:
  #     - id: mypy
  #       args: ["--ignore-missing-imports"]
  #       additional_dependencies:
  #         - pydantic>=2.0

  # NOTE: bandit removed - ruff "S" rules handle security scanning

  # Secret scanning (gitleaks)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["protect", "--staged", "--config=.gitleaks.toml"]

  # JavaScript/TypeScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Helm templates contain Go template syntax, not valid YAML/JSON
        # This is NOT hiding issues - templates are intentionally not parseable
        exclude: "^deploy/helm/.*/templates/"

  # L9 custom checks
  - repo: local
    hooks:
      # Auto-fix hooks (run first, before checks)
      - id: auto-fix-adr
        name: Auto-fix ADR violations (transforms only)
        entry: python3 ci/auto_fix_adr.py --transform-only
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: auto-stub-adr-enforcement
        name: Auto-stub new ADRs into enforcement manifest
        entry: python3 ci/auto_stub_adr_enforcement.py
        language: system
        files: ^readme/adr/\d{4}-.*\.md$
        pass_filenames: false
        stages: [pre-commit]

      - id: check-noqa-placement
        name: Check noqa not inside strings (GMP-CI-2026-02)
        entry: python3 ci/check_noqa_placement.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: check-imports
        name: Check missing imports
        entry: python3 ci/check_imports.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-adr-compliance
        name: Check ADR compliance (errors only)
        entry: python3 ci/check_adr_compliance.py --errors-only
        language: system
        types: [python]
        pass_filenames: false

      - id: check-hardcoded-credentials
        name: Check hardcoded credentials (ADR-0090)
        entry: python3 ci/check_hardcoded_credentials.py
        language: system
        pass_filenames: false

      - id: check-datetime-utcnow
        name: Check datetime.utcnow() usage (ADR-0083)
        entry: python3 ci/check_datetime_utcnow.py
        language: system
        pass_filenames: false

      - id: check-pickle-usage
        name: Check pickle usage (ADR-0088)
        entry: python3 ci/check_pickle_usage.py
        language: system
        pass_filenames: false

      - id: check-fstring-sql
        name: Check f-string SQL (ADR-0087)
        entry: python3 ci/check_fstring_sql.py
        language: system
        pass_filenames: false

      - id: check-print-usage
        name: Check print() usage (ADR-0019)
        entry: python3 ci/check_print_usage.py
        language: system
        pass_filenames: false

      - id: check-logging-module
        name: Check logging module (ADR-0019)
        entry: python3 ci/check_logging_module.py
        language: system
        pass_filenames: false

      - id: check-type-checking
        name: Check TYPE_CHECKING pattern (ADR-0002)
        entry: python3 ci/check_type_checking_pattern.py
        language: system
        pass_filenames: false

  # Generic checkers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: "^(deploy/helm/|deploy/k8s/helm/|readme/)"
      - id: check-added-large-files
