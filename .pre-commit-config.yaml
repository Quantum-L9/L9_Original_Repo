default_language_version:
  python: python3.12

# Global exclude for archived folders
exclude: "(_archived|_archived_|.backup|_pack_staging)"

repos:
  # Python formatters
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # NOTE: black removed - ruff-format handles formatting

  # Python type checking
  # NOTE: mypy disabled in pre-commit until ADR-XXXX type coverage initiative completes
  # Run manually: mypy --config-file pyproject.toml .
  # Current status: 1369 errors in 325 files need fixing
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.14.1
  #   hooks:
  #     - id: mypy
  #       args: ["--ignore-missing-imports"]
  #       additional_dependencies:
  #         - pydantic>=2.0

  # NOTE: bandit removed - ruff "S" rules handle security scanning

  # Secret scanning (gitleaks)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["protect", "--staged", "--config=.gitleaks.toml"]

  # JavaScript/TypeScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Helm templates contain Go template syntax, not valid YAML/JSON
        # This is NOT hiding issues - templates are intentionally not parseable
        exclude: "^deploy/helm/.*/templates/"

  # Generic checkers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: "^(deploy/helm/|readme/)"
      - id: check-added-large-files
