default_language_version:
  python: python3.12

# Global exclude for archived folders
exclude: "(_archived|_archived_|.backup|_pack_staging)"

repos:
  # Python formatters
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # NOTE: black removed - ruff-format handles formatting

  # Python type checking
  # NOTE: mypy disabled in pre-commit until ADR-XXXX type coverage initiative completes
  # Run manually: mypy --config-file pyproject.toml .
  # Current status: 1369 errors in 325 files need fixing
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.14.1
  #   hooks:
  #     - id: mypy
  #       args: ["--ignore-missing-imports"]
  #       additional_dependencies:
  #         - pydantic>=2.0

  # NOTE: bandit removed - ruff "S" rules handle security scanning

  # Secret scanning (gitleaks)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["protect", "--staged", "--config=.gitleaks.toml"]

  # JavaScript/TypeScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Helm templates contain Go template syntax, not valid YAML/JSON
        # This is NOT hiding issues - templates are intentionally not parseable
        exclude: "^deploy/helm/.*/templates/"

  # L9 custom checks
  - repo: local
    hooks:
      # Auto-fix hooks (run first, before checks)
      - id: auto-fix-adr
        name: Auto-fix ADR violations (safe mode)
        entry: python3 ci/auto_fix_adr.py --all --safe
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: check-imports
        name: Check missing imports
        entry: python3 ci/check_imports.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-adr-compliance
        name: Check ADR compliance (errors only)
        entry: python3 ci/check_adr_compliance.py --errors-only
        language: system
        types: [python]
        pass_filenames: false

      - id: check-hardcoded-credentials
        name: Check hardcoded credentials (ADR-0090)
        entry: |
          bash -c 'FOUND=$(grep -rE "AKIA[0-9A-Z]{16}" --include="*.py" --include="*.sh" --include="*.yaml" . 2>/dev/null | grep -v ".venv" | grep -v ".git/" | grep -v ".env" | grep -v scripts/ || true); if [ -n "$FOUND" ]; then echo "❌ AWS keys found" && echo "$FOUND" && exit 1; fi; FOUND=$(grep -rE "(API_KEY|api_key).*\"[a-f0-9]{64}\"" --include="*.py" --include="*.sh" . 2>/dev/null | grep -v ".venv" | grep -v ".git/" | grep -v ".env" | grep -v scripts/ | grep -v local_dashboard/ | grep -v tests/ || true); if [ -n "$FOUND" ]; then echo "❌ Hardcoded API keys found" && echo "$FOUND" && exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: check-datetime-utcnow
        name: Check datetime.utcnow() usage (ADR-0083)
        entry: |
          bash -c 'FOUND=$(grep -rn "\.utcnow()" --include="*.py" . 2>/dev/null | grep -v ".venv" | grep -v "# noqa" | grep -v tests/ | grep -v ci/ | grep -v current_work/ || true); if [ -n "$FOUND" ]; then echo "❌ ADR-0083 datetime.utcnow() is deprecated" && echo "$FOUND" && echo "Fix: Use datetime.now(UTC)" && exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: check-pickle-usage
        name: Check pickle usage (ADR-0088)
        entry: |
          bash -c 'FOUND=$(grep -rn "pickle\.load" --include="*.py" . 2>/dev/null | grep -v ".venv" | grep -v "# noqa" | grep -v tests/ | grep -v ci/ | grep -v current_work/ || true); if [ -n "$FOUND" ]; then echo "❌ ADR-0088 pickle is forbidden (security)" && echo "$FOUND" && echo "Fix: Use json.loads() or msgpack" && exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: check-fstring-sql
        name: Check f-string SQL (ADR-0087)
        entry: |
          bash -c 'FOUND=$(grep -rnE "f\"(SELECT|INSERT|UPDATE|DELETE).*\{" --include="*.py" . 2>/dev/null | grep -v ".venv" | grep -v "# noqa" | grep -v tests/ | grep -v igor/ | grep -v current_work/ || true); if [ -n "$FOUND" ]; then echo "❌ ADR-0087 f-string SQL is forbidden" && echo "$FOUND" | head -10 && echo "Fix: Use parameterized queries or add # noqa: ADR-0087" && exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: check-print-usage
        name: Check print() usage (ADR-0019)
        entry: |
          bash -c 'FOUND=$(grep -rn "^\s*print(" --include="*.py" . 2>/dev/null | grep -v ".venv" | grep -v tests/ | grep -v ci/ | grep -v scripts/ | grep -v tools/ | grep -v workflows/ | grep -v current_work/ | grep -v __main__.py | grep -v mcp_memory/ | grep -v agents/cursor/ | grep -v "# noqa" || true); if [ -n "$FOUND" ]; then echo "❌ ADR-0019 print() forbidden" && echo "$FOUND" | head -10 && echo "Fix: Use structlog" && exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: check-logging-module
        name: Check logging module (ADR-0019)
        entry: |
          bash -c 'FOUND=$(grep -rn "^import logging$\|^from logging import" --include="*.py" . 2>/dev/null | grep -v ".venv" | grep -v tests/ | grep -v ci/ | grep -v scripts/ | grep -v config/logging | grep -v core/observability | grep -v "# noqa" || true); if [ -n "$FOUND" ]; then echo "❌ ADR-0019 stdlib logging forbidden" && echo "$FOUND" && echo "Fix: Use structlog" && exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: check-type-checking
        name: Check TYPE_CHECKING pattern (ADR-0002)
        entry: |
          bash -c 'FAILED=0; grep -rl "if TYPE_CHECKING:" --include="*.py" . 2>/dev/null | grep -v .venv | grep -v tests/ | grep -v current_work/ | while IFS= read -r f; do if ! grep -q "from __future__ import annotations" "$f"; then echo "❌ $f needs __future__ annotations"; FAILED=1; fi; done; exit $FAILED'
        language: system
        pass_filenames: false

  # Generic checkers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: "^(deploy/helm/|deploy/k8s/helm/|readme/)"
      - id: check-added-large-files
