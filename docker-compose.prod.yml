# =============================================================================
# L9 Docker Compose - PRODUCTION OVERLAY
# =============================================================================
# Version: 4.0.0
# Purpose: Production-hardened application services and configurations
# Usage: Combined with base docker-compose.yml
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file deploy/c1/.env.c1 up -d
#   REQUIRED: env file must have all required vars (no missing tolerated). Run scripts/check_compose_env.sh [env-file]
#
# FEATURES:
#   - Immutable container images (no volume mounts)
#   - Resource limits enforced
#   - Production-grade security
#   - Bootstrap service for initialization
#   - Nginx reverse proxy
# =============================================================================

services:
  # ===========================================================================
  # L9 Bootstrap (Runs once on startup, then exits)
  # ===========================================================================
  l9-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-api:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-l9}-bootstrap
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      l9-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: python -m bootstrap
    networks:
      - l9-network
    labels:
      - "com.l9.service=bootstrap"
      - "com.l9.layer=initialization"
      - "com.l9.environment=production"

  # ===========================================================================
  # L9 API - Main Application (Production)
  # ===========================================================================
  l9-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-api:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-l9}-api
    restart: unless-stopped
    depends_on:
      l9-bootstrap:
        condition: service_completed_successfully
      l9-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Database connections
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      MEMORY_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      
      # Neo4j
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      
      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      
      # Container flag
      L9_CONTAINER_ENV: "true"
      
      # Production flags
      LOCAL_DEV: "false"
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:${L9_API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - l9-network
    labels:
      - "com.l9.service=api"
      - "com.l9.layer=application"
      - "com.l9.environment=production"
      - "com.l9.version=${VERSION:-4.0.0}"

  # ===========================================================================
  # MCP Memory Server (Production)
  # ===========================================================================
  l9-mcp-memory:
    build:
      context: .
      dockerfile: Dockerfile.mcp-memory
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-mcp-memory:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-l9}-mcp-memory
    restart: unless-stopped
    depends_on:
      l9-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database connections
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      MEMORY_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      
      # Neo4j (REQUIRED per ADR-0082)
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # MCP Configuration
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9002
      MCP_ENV: production
      
      # Python path for MCP imports
      PYTHONPATH: /app:/app/mcp_memory
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Governance
      GOVERNANCE_HARDENING_ENABLED: ${GOVERNANCE_HARDENING_ENABLED:-true}
      GOVERNANCE_ENFORCEMENT_MODE: ${GOVERNANCE_ENFORCEMENT_MODE:-enforce}
    ports:
      - "127.0.0.1:${MCP_PORT:-9002}:9002"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - l9-network
    labels:
      - "com.l9.service=mcp-memory"
      - "com.l9.layer=protocol"
      - "com.l9.environment=production"
      - "com.l9.version=${VERSION:-4.0.0}"

  # ===========================================================================
  # Nginx - Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-l9}-nginx
    restart: unless-stopped
    depends_on:
      - l9-api
      - l9-mcp-memory
    env_file:
      - .env
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - l9-network
    labels:
      - "com.l9.service=nginx"
      - "com.l9.layer=gateway"
      - "com.l9.environment=production"
