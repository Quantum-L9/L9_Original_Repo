# =============================================================================
# L9 Docker Compose - PRODUCTION OVERLAY (Security-Hardened)
# =============================================================================
# Version: 4.1.0
# Purpose: Production-hardened application services with secure TCP stream proxy
# Usage: Combined with base docker-compose.yml
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# REQUIRED ENV VARS (validate with scripts/check_compose_env.sh):
#   - REDIS_PASSWORD (mandatory for TCP stream exposure)
#   - NEO4J_PASSWORD
#   - POSTGRES_PASSWORD
#
# SECURITY POSTURE (v4.1.0):
#   - Redis REQUIREPASS authentication enforced
#   - TCP stream ports exposed ONLY after firewall rules applied
#   - Network ACLs documented in deploy/c1/FIREWALL.md
#   - Defense-in-depth: app-level + network-level + container-level
#
# FEATURES:
#   - Immutable container images (no volume mounts)
#   - Resource limits enforced
#   - Production-grade security hardening
#   - Bootstrap service for initialization
#   - Nginx reverse proxy + TCP stream proxy
#   - Authenticated Redis with connection pooling
# =============================================================================

services:
  # ===========================================================================
  # L9 Bootstrap (Runs once on startup, then exits)
  # ===========================================================================
  l9-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-api:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-l9}-bootstrap
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      l9-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379  # ← AUTH REQUIRED
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: python -m bootstrap
    networks:
      - l9-network
    labels:
      - "com.l9.service=bootstrap"
      - "com.l9.layer=initialization"
      - "com.l9.environment=production"

  # ===========================================================================
  # L9 API - Main Application (Production)
  # ===========================================================================
  l9-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-api:${VERSION:-latest}
    # container_name removed — prevents clash during rolling deploys
    restart: unless-stopped
    depends_on:
      l9-bootstrap:
        condition: service_completed_successfully
      l9-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Database connections
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      MEMORY_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      
      # Neo4j
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Redis (AUTHENTICATED)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}  # ← REQUIRED for auth
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      
      # Container flag
      L9_CONTAINER_ENV: "true"
      
      # Production flags
      LOCAL_DEV: "false"
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:${L9_API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - l9-network
    labels:
      - "com.l9.service=api"
      - "com.l9.layer=application"
      - "com.l9.environment=production"
      - "com.l9.version=${VERSION:-4.1.0}"

  # ===========================================================================
  # MCP Memory Server (Production)
  # ===========================================================================
  l9-mcp-memory:
    build:
      context: .
      dockerfile: Dockerfile.mcp-memory
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-mcp-memory:${VERSION:-latest}
    # container_name removed — prevents clash during rolling deploys
    restart: unless-stopped
    depends_on:
      l9-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database connections
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      MEMORY_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      
      # Neo4j (REQUIRED per ADR-0082)
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Redis (AUTHENTICATED)
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # MCP Configuration
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9002
      MCP_ENV: production
      
      # Python path for MCP imports
      PYTHONPATH: /app:/app/mcp_memory
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Governance
      GOVERNANCE_HARDENING_ENABLED: ${GOVERNANCE_HARDENING_ENABLED:-true}
      GOVERNANCE_ENFORCEMENT_MODE: ${GOVERNANCE_ENFORCEMENT_MODE:-enforce}
    ports:
      - "127.0.0.1:${MCP_PORT:-9002}:9002"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - l9-network
    labels:
      - "com.l9.service=mcp-memory"
      - "com.l9.layer=protocol"
      - "com.l9.environment=production"
      - "com.l9.version=${VERSION:-4.1.0}"

  # ===========================================================================
  # Nginx - Reverse Proxy + TCP Stream Proxy (Security Hardened)
  # ===========================================================================
  # SECURITY MODEL (Defense-in-Depth):
  #   Layer 1: Host firewall (ufw) - IP whitelisting at kernel level
  #   Layer 2: Nginx stream proxy - TLS termination + connection limits
  #   Layer 3: Application auth - Redis REQUIREPASS, Postgres pg_hba.conf, Neo4j auth
  #
  # DEPLOYMENT PREREQUISITES:
  #   1. Apply firewall rules BEFORE deploying this config:
  #      sudo ufw allow from <TRUSTED_IP> to any port 30432 proto tcp
  #      sudo ufw allow from <TRUSTED_IP> to any port 30474 proto tcp
  #      sudo ufw allow from <TRUSTED_IP> to any port 30687 proto tcp
  #      sudo ufw allow from <TRUSTED_IP> to any port 30379 proto tcp
  #   2. Verify .env contains REDIS_PASSWORD (min 32 chars, base64-encoded)
  #   3. Document trusted IPs in deploy/c1/FIREWALL.md
  # ===========================================================================
  nginx:
    image: nginx:alpine
    # container_name removed — prevents clash during rolling deploys
    restart: unless-stopped
    depends_on:
      - l9-api
      - l9-mcp-memory
      - l9-postgres      # ← Stream proxy dependency
      - neo4j            # ← Stream proxy dependency
      - redis            # ← Stream proxy dependency
    env_file:
      - .env
    ports:
      # HTTP reverse proxy (existing)
      - "0.0.0.0:80:80"
      
      # TCP stream proxies (NEW - require nginx.conf stream blocks)
      # WARNING: These ports are PUBLICLY ROUTABLE. Ensure firewall rules are active.
      - "0.0.0.0:30432:30432"  # PostgreSQL TCP stream (→ l9-postgres:5432)
      - "0.0.0.0:30474:30474"  # Neo4j HTTP stream (→ neo4j:7474)
      - "0.0.0.0:30687:30687"  # Neo4j Bolt stream (→ neo4j:7687)
      - "0.0.0.0:30379:30379"  # Redis stream (→ redis:6379, AUTH required)
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - l9-network
    labels:
      - "com.l9.service=nginx"
      - "com.l9.layer=gateway"
      - "com.l9.environment=production"
      - "com.l9.security.stream-proxy=enabled"
      - "com.l9.security.firewall-required=true"

networks:
  l9-network:
    driver: bridge

# =============================================================================
# SECURITY CHECKLIST (v4.1.0 Compliance)
# =============================================================================
# Before deploying this config, verify:
#
# ✅ 1. Redis authentication configured:
#        - .env has REDIS_PASSWORD set (min 32 chars)
#        - docker-compose.yml redis service has:
#          command: redis-server --requirepass ${REDIS_PASSWORD}
#
# ✅ 2. Firewall rules applied on VPS:
#        sudo ufw allow from <MAC_IP> to any port 30432,30474,30687,30379 proto tcp
#        sudo ufw status numbered  # Verify rules exist
#
# ✅ 3. nginx.conf stream blocks configured:
#        deploy/nginx/nginx.conf must have stream { ... } blocks for each port
#
# ✅ 4. Network ACL documentation:
#        deploy/c1/FIREWALL.md lists all whitelisted IPs with justification
#
# ✅ 5. Test from untrusted IP:
#        telnet <VPS_IP> 30379  # Should timeout (firewall blocked)
#
# ✅ 6. Test from trusted IP:
#        redis-cli -h <VPS_IP> -p 30379 -a <REDIS_PASSWORD> PING  # Should return PONG
#
# POST-DEPLOY MONITORING:
#   - Review nginx stream logs: docker compose logs nginx | grep stream
#   - Monitor failed auth attempts: docker compose exec redis redis-cli --scan
#   - Alert on firewall rule changes: auditd on /etc/ufw/
# =============================================================================

