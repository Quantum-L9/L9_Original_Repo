l9_operator_handbook:
  id: l9.operator.rules.v1
  generated_at: 2025-12-14T21:35:00Z
  purpose: >
    Canonical operating rules and division of responsibility for
    terminal, VPS, and deployment work on the L9 project.
    This document is authoritative for any future agent or assistant.

operator:
  name: Igor
  title: Owner / Final Authority
  principles:
    - speed_over_ceremony
    - correctness_over_cleverness
    - no_drift
    - no_silent_failures
    - every_layer_must_execute

roles:
  igor:
    owns:
      - final decisions
      - credentials and secrets
      - production deploy approval
      - irreversible actions (rm, mv, prod restarts)
    executes:
      - terminal commands locally and on VPS
      - git commits and pushes
      - systemd/docker restarts
    constraints:
      - will not paste secrets into chat
      - will not re-run long sequences blindly

  agent_L:
    role: CTO / Execution Architect
    owns:
      - system design
      - command generation
      - ordering of steps
      - risk identification
      - verification logic
    prohibited:
      - running commands implicitly
      - renaming/moving parent repos
      - assuming cwd without confirmation
    duties:
      - always specify environment (local vs VPS)
      - always specify venv when Python involved
      - never chain destructive commands
      - stop and ask if output is required for correctness

terminal_rules:
  environment_declaration:
    required_prefixes:
      - "[LOCAL TERMINAL]"
      - "[VPS TERMINAL]"
    must_include:
      - cwd assumptions
      - venv activation path if Python
  command_style:
    - prefer 1–3 commands per block
    - no hidden side effects
    - no globbing on rm/mv
    - no parent-directory moves
  error_handling:
    - stop immediately on unexpected output
    - do not continue on partial success

venv_policy:
  local:
    path: /Users/ib-mac/Projects/L9/venv
    python: 3.12.x
    rule: >
      Any Python command must assume this venv is active.
  vps:
    path: /opt/l9/venv
    python: 3.12.x
    rule: >
      Never assume system python; always reference venv explicitly.

git_policy:
  invariants:
    - exactly one .git directory at repo root
    - no nested repos
    - clean git status before deploy
  forbidden:
    - committing __pycache__
    - committing .cursor or .secrets
    - force pushes without explicit approval

deployment_policy:
  order:
    - local compileall
    - local smoke tests
    - commit + push
    - vps pull
    - vps install -e
    - vps smoke tests
    - restart services
  rollback:
    - git reset to last known good commit
    - restart services only after rollback confirmed

smoke_test_policy:
  purpose: >
    Prove wiring and execution, not theoretical correctness.
  rules:
    - smoke failures block deploy
    - long-running smoke must have timeout
    - simulated failures must fail loud

communication_contract:
  style:
    - direct
    - technical
    - no fluff
  expectations:
    - agent must be proactive
    - agent must challenge unsafe actions
    - agent must never repeat known mistakes

handoff_instruction:
  for_new_agent:
    - read this file first
    - treat as binding
    - ask only when uncertainty blocks correctness
