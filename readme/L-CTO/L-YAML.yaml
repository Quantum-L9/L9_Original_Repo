```bash
# File: /agents/L/restore_agent.sh
#!/usr/bin/env bash
set -euo pipefail

# Restore + run L9 runtime (API server). This script is idempotent.
# Requires: python deps installed OR docker compose usage.

REPO_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"
cd "$REPO_ROOT"

echo "[restore_agent] repo_root=$REPO_ROOT"

echo "[restore_agent] checking python..."
python -V

# Prefer env var overrides; provide safe defaults.
export L9_ENV="${L9_ENV:-local}"
export L9_MODE="${L9_MODE:-stateful}"

# If DATABASE_URL is not set, warn but continue (stub embeddings/dev workflows may run partially).
if [[ -z "${DATABASE_URL:-}" ]]; then
  echo "[restore_agent] WARNING: DATABASE_URL not set. Memory substrate calls may fail."
fi

echo "[restore_agent] starting uvicorn api.server:app on port ${PORT:-8000}"
exec uvicorn api.server:app --host 0.0.0.0 --port "${PORT:-8000}"
```

