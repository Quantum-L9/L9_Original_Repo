# L9 Cross-Task Graph Seeds
# ==========================
# Pre-loaded task relationships and dependencies for the World Model
#
# Version: 1.0.0
# Last Updated: 2026-02-02

type: cross_task_graph
version: "1.0"
metadata:
  source: "L9 Development Workflows"
  domain: "task_orchestration"

# =========================================================================
# Task Categories
# =========================================================================
task_categories:
  - id: code_modification
    name: "Code Modification"
    description: "Tasks that change source code"
    risk_level: medium
    requires_approval: false

  - id: code_generation
    name: "Code Generation"
    description: "Tasks that create new code files"
    risk_level: medium
    requires_approval: false

  - id: deployment
    name: "Deployment"
    description: "Tasks that deploy to production"
    risk_level: high
    requires_approval: true

  - id: infrastructure
    name: "Infrastructure"
    description: "Tasks that modify infrastructure"
    risk_level: critical
    requires_approval: true

  - id: analysis
    name: "Analysis"
    description: "Read-only analysis tasks"
    risk_level: low
    requires_approval: false

  - id: testing
    name: "Testing"
    description: "Test execution and verification"
    risk_level: low
    requires_approval: false

# =========================================================================
# Task Dependencies (Common Workflows)
# =========================================================================
task_dependencies:
  # Code Change Workflow
  - workflow: "code_change"
    description: "Standard workflow for modifying code"
    steps:
      - task: "read_existing_code"
        category: analysis
        required: true

      - task: "search_similar_patterns"
        category: analysis
        required: true
        depends_on: []

      - task: "plan_changes"
        category: analysis
        required: true
        depends_on:
          - "read_existing_code"
          - "search_similar_patterns"

      - task: "implement_changes"
        category: code_modification
        required: true
        depends_on:
          - "plan_changes"

      - task: "verify_lints"
        category: testing
        required: true
        depends_on:
          - "implement_changes"

      - task: "run_tests"
        category: testing
        required: true
        depends_on:
          - "implement_changes"

  # Feature Development Workflow
  - workflow: "feature_development"
    description: "Workflow for implementing new features"
    steps:
      - task: "clarify_requirements"
        category: analysis
        required: true

      - task: "search_existing_solutions"
        category: analysis
        required: true

      - task: "design_approach"
        category: analysis
        required: true
        depends_on:
          - "clarify_requirements"
          - "search_existing_solutions"

      - task: "implement_feature"
        category: code_generation
        required: true
        depends_on:
          - "design_approach"

      - task: "add_tests"
        category: code_generation
        required: true
        depends_on:
          - "implement_feature"

      - task: "update_documentation"
        category: code_modification
        required: false
        depends_on:
          - "implement_feature"

      - task: "verify_integration"
        category: testing
        required: true
        depends_on:
          - "implement_feature"
          - "add_tests"

  # GMP Execution Workflow
  - workflow: "gmp_execution"
    description: "Governance Managed Process workflow"
    steps:
      - task: "phase_0_plan"
        category: analysis
        required: true
        description: "Lock TODO plan with file paths and actions"

      - task: "phase_1_baseline"
        category: analysis
        required: true
        depends_on:
          - "phase_0_plan"
        description: "Verify current state before changes"

      - task: "phase_2_implement"
        category: code_modification
        required: true
        depends_on:
          - "phase_1_baseline"
        description: "Execute the planned changes"

      - task: "phase_3_enforce"
        category: testing
        required: true
        depends_on:
          - "phase_2_implement"
        description: "Run linters and type checks"

      - task: "phase_4_validate"
        category: testing
        required: true
        depends_on:
          - "phase_3_enforce"
        description: "Run tests and verify behavior"

      - task: "phase_5_verify"
        category: analysis
        required: true
        depends_on:
          - "phase_4_validate"
        description: "Recursive verification against plan"

      - task: "phase_6_finalize"
        category: analysis
        required: true
        depends_on:
          - "phase_5_verify"
        description: "Generate report and close"

  # Deployment Workflow
  - workflow: "deployment"
    description: "Production deployment workflow"
    steps:
      - task: "verify_tests_pass"
        category: testing
        required: true

      - task: "verify_no_uncommitted"
        category: analysis
        required: true

      - task: "create_deployment_plan"
        category: analysis
        required: true
        depends_on:
          - "verify_tests_pass"
          - "verify_no_uncommitted"

      - task: "get_approval"
        category: deployment
        required: true
        depends_on:
          - "create_deployment_plan"
        requires_human: true

      - task: "execute_deployment"
        category: deployment
        required: true
        depends_on:
          - "get_approval"

      - task: "verify_deployment"
        category: testing
        required: true
        depends_on:
          - "execute_deployment"

      - task: "rollback_if_needed"
        category: deployment
        required: false
        depends_on:
          - "verify_deployment"
        condition: "verification_failed"

# =========================================================================
# Task Blockers (What prevents task completion)
# =========================================================================
common_blockers:
  - blocker: "missing_requirements"
    description: "Task requirements not fully specified"
    resolution: "Ask clarifying questions before proceeding"
    affected_categories:
      - code_generation
      - feature_development

  - blocker: "circular_dependency"
    description: "Import or dependency cycle detected"
    resolution: "Use TYPE_CHECKING pattern or restructure modules"
    affected_categories:
      - code_modification

  - blocker: "approval_required"
    description: "High-risk operation needs human approval"
    resolution: "Request approval via escalation channel"
    affected_categories:
      - deployment
      - infrastructure

  - blocker: "test_failure"
    description: "Tests failing after changes"
    resolution: "Fix failing tests or update expectations if behavior change is intentional"
    affected_categories:
      - code_modification
      - code_generation

# =========================================================================
# Cross-Task Relationships
# =========================================================================
cross_task_relations:
  - source_task: "implement_feature"
    target_task: "update_documentation"
    relation: "triggers"
    condition: "public_api_changed"

  - source_task: "fix_bug"
    target_task: "add_regression_test"
    relation: "requires"
    condition: "always"

  - source_task: "refactor_code"
    target_task: "verify_no_behavior_change"
    relation: "requires"
    condition: "always"

  - source_task: "add_dependency"
    target_task: "update_requirements"
    relation: "triggers"
    condition: "always"

  - source_task: "modify_schema"
    target_task: "create_migration"
    relation: "requires"
    condition: "database_schema_changed"
