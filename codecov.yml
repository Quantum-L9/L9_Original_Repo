codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: 85%
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%

  flags:
    unittests:
      paths:
        - core/
        - memory/
        - api/
        - runtime/
      carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true

ignore:
  - "tests/**"
  - "scripts/**"
  - "ci/**"
  - "tools/**"
  - "l9_private/**"
  - "_archived/**"
  - "readme/**"
  - "current_work/**"
