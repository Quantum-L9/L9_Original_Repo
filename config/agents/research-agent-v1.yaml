# L9 Research Agent v1
# ====================
#
# Specialized agent for deep research tasks.
# Python class: agents.research_agent.ResearchAgent
# Factory: agents.research_agent.create_research_agent()
# API Routes: /research/agent/* (synthesize, discover, generate-spec)
#
# This YAML config defines metadata and capabilities.
# The actual implementation uses Perplexity API directly, not LLM tool calls.

agent_id: research-agent-v1
name: L9 Research Agent
description: >
  Unified research-to-code agent combining:
  - Deep Workflows (5-stage academic research pipeline)
  - Super-Prompt Pack (fast multi-perspective synthesis)
  - Spec Generator (Module-Spec-v2.4 YAML)
  - CodeGen integration (planned)

# Python class binding
python_class: agents.research_agent.ResearchAgent
factory_function: agents.research_agent.create_research_agent

# LLM Configuration (used for spec generation prompts)
model: sonar-reasoning
provider: perplexity
temperature: 0.7
max_tokens: 8000

# Capabilities (Python class methods)
capabilities:
  synthesize:
    description: Fast multi-perspective synthesis (~10 min)
    method: synthesize(topic, context)
    variations: 5  # pragmatic, research, systems, agents, multimodal
    
  discover:
    description: Deep 5-stage academic research (15-25 hours)
    method: discover(topic, domain, stages)
    stages:
      - landscape      # 3-5 hours - map research landscape
      - deep_dive      # 4-6 hours - vertical deep-dives
      - comparative    # 3-5 hours - compare approaches
      - gaps           # 3-4 hours - identify gaps
      - hypotheses     # 2-3 hours - generate hypotheses
      
  generate_spec:
    description: Generate Module-Spec-v2.4 YAML (~1 min)
    method: generate_spec(synthesis, topic, description)
    output_dir: codegen/specs/
    
  research_to_code:
    description: End-to-end pipeline
    method: research_to_code(topic, mode, domain)
    modes:
      - fast  # synthesis only
      - deep  # full discovery
      - full  # both

# API Endpoints (when server is running)
api_endpoints:
  - GET /research/agent/status
  - POST /research/agent/synthesize
  - POST /research/agent/discover
  - POST /research/agent/generate-spec
  - POST /research/agent/research-to-code

# Environment Requirements
environment:
  required:
    - PERPLEXITY_API_KEY  # Required for all operations
  optional:
    - L9_EXECUTOR_API_KEY  # For authenticated API access

# Prompt Variations (for multi-perspective synthesis)
prompt_variations:
  v1_pragmatic:
    name: Implementation-First (Pragmatic)
    focus: Working code first, theory second
    audience: ML engineers building systems today
    
  v2_research:
    name: Theory-First (Research)
    focus: Mathematical foundations, properties, proofs
    audience: Researchers and AI scientists
    
  v3_systems:
    name: Systems Integration (DevOps)
    focus: Deployment, monitoring, scaling, reliability
    audience: Platform engineers, MLOps teams
    
  v4_agents:
    name: Agent-Specific (Autonomous Systems)
    focus: Integration with autonomous agents
    audience: AI agent developers
    
  v5_multimodal:
    name: Multi-Modal Specifics (Cross-Modality)
    focus: Multi-modal fusion challenges
    audience: Computer vision + NLP researchers

# Metadata
version: "1.0.0"
status: production
owner: L9 System
tags:
  - research
  - perplexity
  - synthesis
  - deep-research
  - spec-generation
  - code-generation

