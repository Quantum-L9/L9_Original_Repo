schema_id: heuristic
schema_version: "1.0"
description: >
  Defines judgment rules and best practices that guide decision-making.
  Heuristics are softer than constraints but still enforced.

required_fields:
  - heuristic_id
  - rule
  - rationale

optional_fields:
  - why
  - violation_signals
  - auto_fixes
  - severity
  - examples

field_definitions:
  heuristic_id:
    type: string
    pattern: "^H-[A-Z]+-[0-9]{3}$"
    description: "Unique identifier (e.g., H-EXC-001)"

  rule:
    type: string
    description: "The heuristic rule in plain English"
    examples:
      - "never_swallow_exceptions"
      - "prefer_idempotent_operations"

  rationale:
    type: string
    description: "Why this heuristic exists"

  why:
    type: string
    description: "Deeper explanation of the reasoning"

  violation_signals:
    type: array
    description: "Code patterns that indicate a violation"
    examples:
      - "except: pass"
      - "bare except clause"

  auto_fixes:
    type: array
    description: "Automatic corrections that can be applied"

  severity:
    type: enum
    values: [critical, warning, info]
    default: warning
    description: "How important this heuristic is"

  examples:
    type: object
    properties:
      bad:
        type: array
        description: "Examples of violations"
      good:
        type: array
        description: "Examples of correct usage"

classification_hints:
  keywords:
