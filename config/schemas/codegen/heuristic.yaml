runtime_behavior:
  effect: "subtle_guardrails"
  enforcement: "pattern detection"
  failure_action: "warn and suggest fix"

examples:
  - heuristic_id: H-EXC-001
    rule: "never_swallow_exceptions"
    rationale: "Silent failures hide bugs and make debugging impossible"
    severity: critical
    violation_signals:
      - "except: pass"
      - "except Exception: pass"
    examples:
