# config/adr-enforcement.yaml
# Maps ADR → enforcement mechanism → CI job
# CI validates this file is complete for all 'accepted' ADRs
#
# When adding a new ADR to readme/adr/, CI will fail until you either:
#   1. Add an enforcement entry under 'rules:' with at least one mechanism
#   2. Add an exempt entry under 'exempt:' with a reason
#
# Enforcement types: semgrep, grep, python, test
# CI jobs: adr-compliance, l9-patterns, path-safety-guard, dora-check, crypto-guard
# New gates (2026-02-16): check_forbidden_imports, check_tool_wiring, check_no_deprecated_services,
#   check_schema_deprecation, check_tool_naming, check_substrate_api, check_packet_type_naming,
#   check_protected_files, check_definition_of_done, check_dependency_patterns, validate_policy_schemas

schema_version: "1.0"

rules:
  # =========================================================================
  # SECURITY TIER — Always error, blocks CI
  # =========================================================================

  - adr: "0001"
    title: "Path Safety"
    enforcement:
      - type: semgrep
        rule_file: ".sec/semgrep.yaml"
        ci_job: "path-safety-guard"
      - type: python
        script: "ci/check_adr_compliance.py"
        ci_job: "adr-compliance"

  - adr: "0083"
    title: "Datetime UTC Standard"
    enforcement:
      - type: grep
        pattern: "\\.utcnow()"
        ci_job: "adr-compliance"
      - type: semgrep
        rule_file: ".semgrep/l9-rules.yaml"
        ci_job: "l9-patterns"
      - type: python
        script: "ci/check_adr_compliance.py"
        ci_job: "adr-compliance"

  - adr: "0087"
    title: "SQL Parameterization"
    enforcement:
      - type: grep
        pattern: 'f"(SELECT|INSERT|UPDATE|DELETE).*\{'
        ci_job: "adr-compliance"
      - type: semgrep
        rule_file: ".semgrep/l9-rules.yaml"
        ci_job: "l9-patterns"
      - type: python
        script: "ci/check_adr_compliance.py"
        ci_job: "adr-compliance"

  - adr: "0088"
    title: "No Pickle Serialization"
    enforcement:
      - type: grep
        pattern: "pickle\\.load"
        ci_job: "adr-compliance"
      - type: semgrep
        rule_file: ".semgrep/l9-rules.yaml"
        ci_job: "l9-patterns"
      - type: python
        script: "ci/check_adr_compliance.py"
        ci_job: "adr-compliance"

  - adr: "0090"
    title: "No Hardcoded Credentials"
    enforcement:
      - type: grep
        pattern: "postgresql://.*:.*@"
        ci_job: "adr-compliance"
      - type: python
        script: "ci/check_adr_compliance.py"
        ci_job: "adr-compliance"

  - adr: "0095"
    title: "Unsafe eval() Remediation"
    enforcement:
      - type: semgrep
        rule_file: ".semgrep/l9-rules.yaml"
        ci_job: "l9-patterns"
      - type: python
        script: "ci/check_adr_compliance.py"
        ci_job: "adr-compliance"

  # =========================================================================
  # CODE QUALITY TIER — Warning by default, error in --strict
  # =========================================================================

  - adr: "0002"
    title: "TYPE_CHECKING Imports"
    enforcement:
      - type: grep
        pattern: "TYPE_CHECKING"
        ci_job: "adr-compliance"
      - type: python
        script: "ci/check_adr_compliance.py"
        ci_job: "adr-compliance"

  - adr: "0004"
