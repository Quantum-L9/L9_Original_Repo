subsystems:
  code_mutation:
    config_path: config/subsystems/code_mutation.yaml
    enabled: true
    priority: high
    max_parallel: 1
    description: "Agentic code generation and mutation tracking"

  tools:
    config_path: config/subsystems/tools.yaml
    enabled: true
    priority: medium
    max_parallel: 2
    description: "Tool registry and capability-based dispatch"

  auth:
    config_path: config/subsystems/auth.yaml
    enabled: true
    priority: critical
    max_parallel: 1
    description: "Authentication, authorization, and RLS"

  memory_retrieval:
    config_path: config/subsystems/memory_retrieval.yaml
    enabled: true
    priority: medium
    max_parallel: 3
    description: "Memory query, retrieval, and ranking"

orchestration:
  execution_model: mixed_sequential_parallel
  default_pattern: config/patterns/pipeline_v1.yaml
  rules:
    - "code_mutation must complete before other subsystems mutate repo"
    - "auth changes require sequential execution (no parallel)"
    - "tools and memory_retrieval can run in parallel"
    - "Each subsystem runs its own N1-N9 pipeline independently"
