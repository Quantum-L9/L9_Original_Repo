    file_descriptions:
      registry_adapter.py: RegistryAdapter for tool discovery and dispatch (PROTECTED)
      tool_graph.py: Tool definitions and L_TOOLS_DEFINITIONS registry (PROTECTED)
      sanitizer.py: Input sanitization and validation for tool arguments
      memory_tools.py: Memory-related tools (search, write, retrieve)
      research_tools.py: Research and web search tools
      reflection_tools.py: Self-reflection and metacognition tools
      tool_embeddings.py: Semantic tool discovery via embeddings
    naming_conventions:
    - '**Tool definitions:** UPPER_SNAKE_CASE in L_TOOLS_DEFINITIONS'
    - '**Tool wrappers:** `<name>_tool` function'
    - '**Tool classes:** `<Name>Tool` (if class-based)'
    edge_cases:
    - name: Tool not found
      description: Requested tool name not in registry → raise ToolNotFoundError
    - name: Capability denied
      description: Agent lacks capability for tool → log warning, return capability
        error
    - name: Approval required
      description: High-risk tool needs Igor approval → block until approved or timeout
    - name: Input validation failure
      description: Tool arguments fail schema validation → return validation error
    responsibilities:
    - Tool manifest registry and discovery
    - Capability enforcement per agent
    - Approval gates for high-risk tools
    - Tool input sanitization and validation
    - Audit logging of all tool executions
    non_responsibilities:
    - Actual tool implementation (tools are self-contained)
    - Agent execution logic (owned by core/agents)
    - Memory operations (owned by memory/)
    api_example: "```python\nfrom core.tools import RegistryAdapter, AgentCapabilities\n\
      \nadapter = RegistryAdapter()\n\n# Get available tools for agent\ntools = adapter.get_tools_for_capabilities(\n\
      \    AgentCapabilities.RESEARCH | AgentCapabilities.MEMORY_READ\n)\n\n# Invoke\
      \ a tool\nresult = await adapter.invoke_tool(\n    tool_name=\"search_web\"\
      ,\n    arguments={\"query\": \"AI breakthroughs 2025\"},\n    agent_id=\"researcher-001\"\
      ,\n    correlation_id=\"corr-xyz789\",\n)\n\nprint(result.success)  # True\n\
      print(result.output)   # Search results\n```\n"
  memory:
    path: memory
    title: Memory Substrate
    tier: core
    description: Multi-layer memory with PacketEnvelope storage, semantic search,
      and audit trails
    purpose: Provides PacketEnvelope storage, semantic search, retrieval, deduplication,
      and audit trails.
    owner: Igor
    last_updated: '2026-02-14T08:25:39Z'
    protected_files:
    - substrate_service.py
    - substrate_dag.py
    - substrate_models.py
    forbidden_scopes:
    - substrate_service.py
    - substrate_dag.py
    - __init__.py
    allowed_patterns:
    - retrieval.py
    - semantic_search.py
    - context_builder.py
    - insight_extraction.py
    - consolidation.py
    - deduplication.py
    - graph_memory.py
    - tests/**
    - docs/**
    depends_on:
    - runtime/redis_client.py
    - config/di_config.py
    depended_by:
    - core/agents/executor.py
    - api/memory/router.py
    - mcp_memory/src/
    invariants:
    - All packet IDs are UUIDv4
    - All timestamps are UTC ISO-8601
    - PacketEnvelope is the canonical data structure for all memory writes
    - Embeddings are list[float] with dimension 1536 or 3072
    - Deduplication via dedup_key prevents duplicate ingestion
    prereading:
    - README-L9_ARCHITECTURE.md
    - docs/CURSOR-RUNBOOK.md
    - memory/README.md
    file_descriptions:
      substrate_service.py: MemorySubstrateService - core ingestion, search, retrieval
        (PROTECTED)
      substrate_dag.py: Ingestion DAG and processing pipeline (PROTECTED)
      substrate_models.py: PacketEnvelope and data models (PROTECTED)
      retrieval.py: Memory retrieval strategies and ranking
      semantic_search.py: Vector-based semantic search implementation
      context_builder.py: Context assembly for agent execution
      insight_extraction.py: Pattern recognition and insight mining
      consolidation.py: Memory consolidation and cleanup workflows
      deduplication.py: Deduplication engine for packet uniqueness
      graph_memory.py: Neo4j graph memory adapter
    naming_conventions:
    - '**Packets:** `PacketEnvelope` with `kind`, `payload`, `metadata`'
    - '**IDs:** UUIDv4 for all packet identifiers'
    - '**Timestamps:** UTC ISO-8601 format'
    - '**Embeddings:** `list[float]` with dimension 1536 or 3072'
    edge_cases:
    - name: Duplicate packet
      description: Same dedup_key already exists → skip ingestion, return existing
        packet
    - name: Embedding failure
      description: Embedding API unavailable → queue for retry, store without embedding
    - name: Search timeout
      description: Vector search exceeds timeout → return partial results with warning
    - name: Graph sync failure
      description: Neo4j unavailable → PostgreSQL is source of truth, retry graph
        sync
    - name: Large payload
      description: Payload > 10KB → store in blob storage, reference in packet
    responsibilities:
    - PacketEnvelope ingestion and storage
    - Semantic search via embeddings
    - Memory retrieval and ranking
    - Deduplication enforcement
    - Audit trail maintenance
    - Graph memory synchronization
    non_responsibilities:
    - Agent execution (owned by core/agents)
    - API routing (owned by api/)
    - External client communication (owned by mcp_memory/)
    lifecycle:
      startup: '1. **Connection:** Establish PostgreSQL and Redis connections.

        2. **Schema validation:** Verify database schema is current.

        3. **Index loading:** Load vector indices for semantic search.

        4. **Ready:** Service ready to accept ingestion and search requests.

        '
      execution: '1. **Ingestion:** Receive PacketEnvelope → validate → check dedup
        → store.

        2. **Embedding:** Generate embedding async if content present.

        3. **Graph sync:** Sync to Neo4j if graph_memory enabled.

        4. **Search:** Vector search → rank results → return with metadata.

        '
      shutdown: '1. **Flush:** Complete pending writes.

        2. **Disconnect:** Close database connections gracefully.

        3. **Log:** Emit shutdown complete event.

        '
      background: Embedding generation, graph sync, and consolidation run as background
        tasks.
    api_example: "```python\nfrom memory import MemorySubstrateService, PacketEnvelope\n\
      from datetime import datetime, timezone\n\nservice = MemorySubstrateService()\n\
      \n# Ingest a packet\npacket = PacketEnvelope(\n    source_id=\"cursor_session\"\
      ,\n    agent_id=\"researcher-001\",\n    thread_id=\"thread-xyz\",\n    kind=\"\
      REASONING\",\n    payload={\"content\": \"Analysis of AI trends...\"},\n   \
      \ metadata={\"confidence\": 0.85},\n)\nresult = await service.ingest_packet(packet)\n\
      \n# Search memory\nresults = await service.search(\n    query=\"AI trends analysis\"\
      ,\n    limit=10,\n    min_similarity=0.7,\n)\n\nfor r in results:\n    print(r.packet_id,\
      \ r.similarity, r.payload)\n```\n"
