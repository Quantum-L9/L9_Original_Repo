subsystems:
  core_agents:
    path: core/agents
    title: Agent Execution Runtime
    tier: core
    description: Agent executor, runtime, registry, and task lifecycle management
    purpose: Orchestrates agent task execution, kernel loading, tool dispatch, and
      memory integration.
    owner: Igor
    last_updated: '2026-02-14T08:25:39Z'
    protected_files:
    - executor.py
    - registry.py
    - aios_runtime.py
    forbidden_scopes:
    - executor.py
    - registry.py
    - __init__.py
    allowed_patterns:
    - adaptive_prompting.py
    - selfreflection.py
    - prompt_builder.py
    - agent_instance.py
    - bootstrap/**
    - graph_state/**
    - tests/**
    - docs/**
    depends_on:
    - memory/substrate_service.py
    - core/tools/registry_adapter.py
    - runtime/kernel_loader.py
    depended_by:
    - api/agent_routes.py
    - runtime/task_queue.py
    - orchestrators/agent_execution/
    invariants:
    - Agent IDs are UUIDv4 or registered agent names
    - All agent tasks emit PacketEnvelope to memory substrate
    - Kernel stack loaded via KernelLoader before execution
    - Tool access mediated by RegistryAdapter with capability checks
    - High-risk tools require Igor approval before dispatch
    prereading:
    - README-L9_ARCHITECTURE.md
    - docs/CURSOR-RUNBOOK.md
    - core/agents/README.md
    file_descriptions:
      executor.py: Core agent execution loop, context management, and signal handling
        (PROTECTED)
      registry.py: Agent type registry and discovery (PROTECTED)
      aios_runtime.py: AIOS runtime wrapper for agent execution (PROTECTED)
      agent_instance.py: Agent instance lifecycle and state management
      prompt_builder.py: Dynamic prompt construction from kernels and context
      schemas.py: Pydantic models for agent requests/responses
      adaptive_prompting.py: Context-aware prompt adaptation strategies
      selfreflection.py: Agent self-reflection and metacognition
    naming_conventions:
    - '**Agent classes:** `<Name>Agent` (e.g., `ResearcherAgent`)'
    - '**Executor classes:** `<Name>Executor` or `AgentExecutorService`'
    - '**Config models:** `<Name>Config` (e.g., `AgentConfig`)'
    - '**Request/Response:** `<Operation>Request`, `<Operation>Response`'
    edge_cases:
    - name: Token exhaustion
      description: Agent hits token budget mid-execution → returns partial result
        with 'incomplete' status
    - name: Tool unavailable
      description: Requested tool not in agent's capability set → logged warning,
        agent continues without tool
    - name: Memory timeout
      description: Memory substrate query times out → agent continues with cached
        context
    - name: Deadline exceeded
      description: Execution time exceeds deadline → agent interrupted, partial result
        returned
    - name: Kernel load failure
      description: Kernel YAML invalid → agent fails fast with clear error message
    responsibilities:
    - Agent execution model (start, run, shutdown)
    - Kernel registry and discovery
    - Agent lifecycle management
    - Context propagation (correlation_id, user, execution context)
    - Tool dispatch coordination via RegistryAdapter
    non_responsibilities:
    - Tool execution logic (owned by core/tools)
    - Memory persistence (owned by memory/)
    - Network/WebSocket communication (owned by runtime/)
    - Authentication (owned by api/auth.py)
    lifecycle:
      startup: '1. **Discovery:** Agent name resolved via `AgentRegistry.get_agent()`.

        2. **Manifest loading:** YAML config parsed and validated.

        3. **Kernel instantiation:** Kernel instance created (lightweight).

        4. **Context creation:** ExecutionContext initialized with correlation_id,
        user, deadline.

        '
      execution: '1. **Planning:** Kernel calls LLM to plan next action.

        2. **Tool invocation:** If plan calls tool, dispatched via RegistryAdapter.

        3. **Memory updates:** Agent reads recent memory and writes findings.

        4. **Iteration:** Repeat until goal achieved or timeout/max-steps.

        '
      shutdown: '1. **Finalization:** Kernel writes remaining state to memory.

        2. **Logging:** Execution trace emitted as structured JSON.

        3. **Cleanup:** Context released, resources freed.

        4. **Result:** AgentResult returned to caller.

        '
      background: None. Agents are synchronous from task queue worker perspective.
    api_example: "```python\nfrom core.agents import AgentRegistry, ExecutionContext\n\
      from uuid import uuid4\nfrom datetime import datetime, timedelta, timezone\n\
      \nregistry = AgentRegistry()\nresearcher = registry.get_agent(\"researcher\"\
      )\n\nresult = await researcher.execute(\n    agent_id=\"researcher-001\",\n\
      \    goal=\"Find top 3 AI breakthroughs in 2025\",\n    memory_context={\"recent_findings\"\
      : [...]},\n    tools_available=[\"search_web\", \"fetch_url\"],\n    context=ExecutionContext(\n\
      \        correlation_id=str(uuid4()),\n        user_id=\"user-123\",\n     \
      \   deadline=datetime.now(timezone.utc) + timedelta(minutes=10),\n        token_budget_remaining=100000,\n\
      \    ),\n)\n\nprint(result.output)  # Agent's findings\nprint(result.tool_invocations)\
      \  # Tools called\n```\n"
