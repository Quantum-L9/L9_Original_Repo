  api:
    path: api
    title: API Gateway
    tier: api
    description: HTTP and WebSocket interfaces for L9 Secure AI OS
    purpose: Exposes FastAPI endpoints for agent tasks, memory operations, and real-time
      communication.
    owner: Igor
    last_updated: '2026-02-14T08:25:39Z'
    protected_files:
    - server.py
    - auth.py
    forbidden_scopes:
    - server.py
    - auth.py
    - __init__.py
    allowed_patterns:
    - routes/**
    - agent_routes.py
    - os_routes.py
    - memory/**
    - tools/**
    - tests/**
    - docs/**
    depends_on:
    - core/agents/executor.py
    - memory/substrate_service.py
    - runtime/websocket_orchestrator.py
    depended_by: []
    invariants:
    - Request/response schemas validated via Pydantic
    - All logging is structured JSON with context (agent_id, task_id)
    - WebSocket routes use websocket_orchestrator for lifecycle
    - Rate limiting enforced via RateLimiter with Redis backend
    prereading:
    - README-L9_ARCHITECTURE.md
    - docs/CURSOR-RUNBOOK.md
    - api/README.md
    file_descriptions:
      server.py: FastAPI app initialization, route registration (PROTECTED)
      auth.py: Authentication and authorization middleware (PROTECTED)
      agent_routes.py: Agent execution endpoints (/agents, /tasks)
      os_routes.py: OS-level operations and health checks
      routes/: Domain-specific route modules
      memory/router.py: Memory API endpoints (/memory/search, /memory/ingest)
      tools/router.py: Tool API endpoints (/tools/invoke)
    naming_conventions:
    - '**Routes:** kebab-case paths (e.g., `/api/agent-tasks`)'
    - '**Handlers:** `async def verb_noun()` (e.g., `async def create_task()`)'
    - '**Request models:** `<Noun><Verb>Request` (e.g., `TaskCreateRequest`)'
    - '**Response models:** `<Noun><Verb>Response` (e.g., `TaskCreateResponse`)'
    edge_cases:
    - name: Invalid request body
      description: Pydantic validation fails → 422 with validation errors
    - name: Authentication failure
      description: Invalid/expired JWT → 401 Unauthorized
    - name: Rate limit exceeded
      description: Too many requests → 429 with retry-after header
    - name: Agent timeout
      description: Agent execution exceeds timeout → 504 Gateway Timeout
    - name: WebSocket disconnect
      description: Client disconnects unexpectedly → cleanup resources, log event
    responsibilities:
    - HTTP endpoint routing and handling
    - WebSocket connection management
    - Request/response validation
    - Authentication and authorization
    - Rate limiting enforcement
    - Structured logging with context
    non_responsibilities:
    - Agent execution logic (owned by core/agents)
    - Memory storage (owned by memory/)
    - Tool execution (owned by core/tools)
    lifecycle:
      startup: '1. **App creation:** FastAPI app initialized.

        2. **Middleware:** CORS, auth, logging middleware registered.

        3. **Routes:** All routers mounted to app.

        4. **Lifespan:** Startup events connect to Redis, PostgreSQL.

        '
      execution: '1. **Request:** Receive HTTP/WebSocket request.

        2. **Auth:** Validate JWT token (if required).

        3. **Rate check:** Verify rate limit not exceeded.

        4. **Dispatch:** Route to handler, execute, return response.

        '
      shutdown: '1. **Drain:** Stop accepting new requests.

        2. **Pending:** Wait for in-flight requests to complete.

        3. **Cleanup:** Close database pools, Redis connections.

        4. **Log:** Emit graceful shutdown event.

        '
      background: Background tasks via Starlette BackgroundTasks for non-blocking
        operations.
    api_example: "```python\n# HTTP Example\nimport httpx\n\nasync with httpx.AsyncClient()\
      \ as client:\n    # Execute an agent task\n    response = await client.post(\n\
      \        \"http://localhost:8000/api/agents/researcher/execute\",\n        json={\n\
      \            \"goal\": \"Analyze AI market trends\",\n            \"context\"\
      : {\"recent_data\": [...]},\n        },\n        headers={\"Authorization\"\
      : \"Bearer <token>\"},\n    )\n    result = response.json()\n    print(result[\"\
      output\"])\n\n# WebSocket Example\nimport websockets\n\nasync with websockets.connect(\"\
      ws://localhost:8000/ws\") as ws:\n    await ws.send(json.dumps({\n        \"\
      type\": \"agent.execute\",\n        \"agent_id\": \"researcher\",\n        \"\
      goal\": \"Find AI trends\",\n    }))\n    response = await ws.recv()\n    print(json.loads(response))\n\
      ```\n"
