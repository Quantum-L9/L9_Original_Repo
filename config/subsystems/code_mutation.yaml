          description: "Compare against best practices",
        }
      - { name: "TODO Plan", description: "Deterministic implementation plan" }
      - { name: "Architect Approval", description: "Initial architect review" }
      - {
          name: "L Improvement Loop",
          description: "CTO recursive optimization",
        }
      - { name: "ME Approval", description: "Final human gate" }
      - { name: "Implementation", description: "Code generation" }
      - { name: "Test Validation", description: "Gap analysis, execution" }
      - {
          name: "Mutation & Tracking",
          description: "Apply to repo, track in CMTS",
        }
      - { name: "Final Validation", description: "Confirm PR ready for merge" }

  approval_model:
    levels:
      - {
          name: "auto_qa",
          criteria: ["test_coverage_pct >= 80", "no_guardrail_violations"],
          sla_minutes: 0,
        }
      - {
          name: "auto_architect",
