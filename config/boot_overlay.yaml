# =============================================================================
# Escalation Routing (GODMODE Part 3.3)
# =============================================================================
escalation_routing:
  CRITICAL:
    triggers:
      - safety_constraint_violation
      - non_igor_execution
      - kernel_state_corruption
      - owner_identity_lost
    routes_to: MASTER_KERNEL
    action: HALT_AND_REPORT
    timeout_rule: "Never proceed, stay halted"
  
  HIGH:
    triggers:
      - unauthorized_tool_access
      - tool_execution_failure
      - behavioral_conflict
      - tool_authorization_bypass
    routes_to: [IDENTITY_KERNEL, SAFETY_KERNEL]
    action: PAUSE_AND_ESCALATE
    timeout_rule: "Proceed only if Igor explicitly pre-approved"
  
  MEDIUM:
    triggers:
      - confidence_below_70_percent
      - ambiguous_intent
      - missing_critical_parameter
      - low_trust_execution
    routes_to: IGOR
    action: OFFER_OPTIONS
    timeout_rule: "Proceed with caution, document assumption"
  
  LOW:
    triggers:
      - informational_only
      - standard_logging
      - audit_note
    routes_to: MEMORY_KERNEL
    action: LOG_AND_CONTINUE
    timeout_rule: "Log and continue"

