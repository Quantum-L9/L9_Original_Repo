# ============================================================================
# L9 Governance - Protected Files Policy
# =======================================
# Single source of truth for protected file definitions.
#
# GMP-104: Consolidates PROTECTED_BY_LCTO and SUBSYSTEM_PROTECTED from
# .github/scripts/validate-protected-files.py into declarative policy.
#
# Protected files require approval per approval_requirements below.
# L (CTO) must follow the same protected-file policy as everyone else—no exemption.
#   - Igor (Boss): Any file with audit trail
#   - L (CTO): Designated owner for listed surfaces; L still requires approval/process
#   - Cursor (IDE): Non-protected files only
id: protected_files
version: "1.1"
protected_files:
  # ==========================================================================
  # LCTO-OWNED FILES (flat list)
  # ==========================================================================
  # Core infrastructure owned by L (CTO). Changes require approval and review.
  # L is not exempt: L must follow the same protected-file policy as everyone else.
  lcto_controlled:
    - path: runtime/websocket_orchestrator.py
      reason: "Real-time communication core"
      owner: L

    - path: runtime/kernel_loader.py
      reason: "Governance kernel loading"
      owner: L

    - path: docker-compose.yml
      reason: "Infrastructure orchestration"
      owner: L

    - path: runtime/redis_client.py
      reason: "State management core"
      owner: L

    - path: core/agents/executor.py
      reason: "Agent execution engine"
      owner: L

  # ==========================================================================
  # SUBSYSTEM-PROTECTED FILES
  # ==========================================================================
  # Files protected by subsystem ownership.
  # Changes require subsystem owner approval.

  subsystems:
    agents:
      owner: L
      files:
        - core/agents/executor.py
        - core/agents/registry.py
        - core/agents/__init__.py

    memory:
      owner: L
      files:
        - memory/substrate_service.py
        - memory/substrate_dag.py
        - memory/__init__.py

    tools:
      owner: L
      files:
        - core/tools/registry_adapter.py
        - core/tools/tool_graph.py
        - core/tools/__init__.py

  # ==========================================================================
  # PROTECTED PATTERNS (fnmatch-style; apply to all including L)
  # ==========================================================================
  protected_patterns:
    - pattern: "Dockerfile"
      reason: "Root container image"
    - pattern: "Dockerfile.*"
      reason: "Variant container images"
    - pattern: ".github/workflows/*.yml"
      reason: "CI pipeline definitions"
    - pattern: ".github/scripts/*.py"
      reason: "CI and governance scripts"
    - pattern: "requirements*.txt"
      reason: "Python dependency lockfiles"
    - pattern: "pyproject.toml"
      reason: "Project and tool config"
    - pattern: "Makefile"
      reason: "Build and task entrypoints"
    - pattern: "runtime/*"
      reason: "Runtime core (kernel, WS, Redis, etc.)"
    - pattern: "scripts/deployment/*"
      reason: "Deploy and release scripts"

  # ==========================================================================
  # APPROVAL REQUIREMENTS
  # ==========================================================================
  approval_requirements:
    # Applies to everyone including L (CTO). No one is exempt.
    lcto_controlled:
      - Get approval per process (L is owner but must follow same policy)
      - Open an issue documenting the change
      - Include risk assessment and rollback plan

    subsystem:
      - Get approval from subsystem owner
      - Include test coverage for changes
      - Document API changes if any

    patterns:
      - Same as lcto_controlled; patterns cover Dockerfile, CI, runtime/*, etc.
