# ============================================================================
# CURSOR WORKFLOW KERNEL — BINDING CONTRACT
# ============================================================================
# This kernel governs Cursor agent behavior. Treat as LAW.
# Any repo. Any session. Load at startup. Enforce always.
# ============================================================================

id: cursor_workflow_kernel
name: Cursor Workflow Kernel
version: "1.1.0"
schema: config/schemas/cursor_kernel.schema.yaml # T5: Schema validation
type: kernel
status: active
scope: cursor_agent
owner: Igor
author: L

description: >
  Governs Cursor agent behavior: TODO tracking, memory operations, execution
  style, and confidence-based decision logic. This is a BINDING CONTRACT —
  load at session startup and enforce throughout.

# ============================================================================
# INITIALIZATION
# ============================================================================
init:
  on_load:
    print_confirmation: false
    adopt_behavior_immediately: true
    lock_in_for_session: true
  required_context:
    # T4: Loading mechanism with fallbacks
    - path: workflow_state.md
      load_method: file_read
      optional: false
      cache_duration: session
    - path: .cursor-commands/learning/failures/repeated-mistakes.md
      load_method: file_read
      optional: true
      fallback: search_memory_for_lessons

# ============================================================================
# MEMORY OPERATIONS (T1: MCP Tool Mapping) - Updated 2026-01-31
# ============================================================================
memory_ops:
  # C1 Connection (CRITICAL: Use direct IP to bypass Cloudflare)
  mcp_base_url: "http://46.62.243.82/memory"
  mcp_endpoint: "/mcp/call"  # Full: http://46.62.243.82/memory/mcp/call
  api_key_env: "MCP_API_KEY_C"
  api_key_value: "4836ea7e0f46c81fd6860c05f1be94577fbb99970fb378c49901cc6cffb9dd07"
  
  # RLS Configuration
  user_id: "l9-shared"  # Shared namespace for L + Cursor
  caller_id: "C"        # Cursor IDE identifier
  allowed_scopes: [developer, global]  # C cannot access l-private
  
  # IMPORTANT: Use /mcp/call, NOT REST endpoints
  # REST endpoints (/search, /save) don't set governance context
  use_rest_endpoints: false
  use_mcp_call: true

  read:
    session_state:
      tool: search_memory
      query: "session {today} context state"
      scopes: [developer, global]
      top_k: 5
    prior_instructions:
      tool: search_memory
      query: "Igor instructions preferences"
      scopes: [developer, global]
      kinds: [preference]
      top_k: 10
    workflow_state:
      tool: file_read  # Local file, not MCP
      path: workflow_state.md
    mistake_patterns:
      tool: search_memory
      query: "lesson error mistake pattern"
      scopes: [developer, global]
      kinds: [lesson, error]
      top_k: 10

  write:
    # PacketEnvelope v2.0 schema
    schema_version: "2.0.0"
    derived_specifications:
      tool: save_memory
      kind: insight
      scope: developer
      duration: long
    execution_flows:
      tool: save_memory
      kind: context
      scope: developer
      duration: medium
    lessons_learned:
      tool: save_memory
      kind: lesson
      scope: developer
      duration: long

  persistence_rules:
    - prefer_structured_state
    - no_overwriting_without_versioning
    - maintain_semantic_consistency
    - dedupe_before_write  # Check similarity > 0.8 before saving
    - use_mcp_call_not_rest  # Governance context required

# ============================================================================
# ERROR RECOVERY (T2: Resilience for VPS downtime)
# ============================================================================
error_recovery:
  memory_unavailable:
    behavior: continue_with_warning
    log_level: warning
    fallback: local_context_only
    message: "⚠️ Memory unavailable - proceeding with local context"

  mcp_timeout:
    timeout_ms: 5000
    retry_count: 2
    retry_delay_ms: 500
    on_exhaust: proceed_without_memory

  search_empty:
    behavior: continue
    fallback: use_default_patterns

  write_failed:
    behavior: warn_and_continue
    retry_once: true
    log_for_later_sync: true

  confidence_when_degraded:
    reduce_by_percent: 20
    min_confidence: 0.50
    require_extra_validation: true

  # Cloudflare blocking (error code 1010)
  cloudflare_blocked:
    symptom: "error code: 1010"
    cause: "Domain goes through Cloudflare which blocks Python user-agent"
    fix: "Use direct IP 46.62.243.82 instead of l9.quantumaipartners.com"
    
  # Governance context missing
  governance_context_required:
    symptom: "Governance context required for memory operation"
    cause: "Using REST endpoint instead of MCP /mcp/call"
    fix: "Always use /mcp/call endpoint for memory operations"

# ============================================================================
# TODO TRACKING
# ============================================================================
todo_tracker:
  memory_target: active_memory
  context_slot: session_todo
  update_after_every_prompt: true
  add_to_memory_on_change: true
  display_every_n_prompts: 3
  formatting:
    collapse_completed: true
    group_by_context: true
    inline_render: true

# ============================================================================
# ROADMAP / MILESTONES
# ============================================================================
roadmap:
  track_milestones: true
  milestone_tags:
    - alpha
    - design
    - impl
    - testing
    - review
    - stable
  attach_to_todos_if_detected: true
  allow_user_set_milestones: true
  show_milestone_progress: true
  emit_summary_on_request: true

# ============================================================================
# EXECUTION STYLE (BINDING)
# ============================================================================
execution_style:
  voice:
    tone: direct
    verbosity: minimal
    humor: only_if_sharpens_point
    no_sycophancy: true
  structure:
    headings: short
    bullets: true
    avoid_tables: false
    deliverables_first: true
  rules:
    - surgical_edits_only
    - run_commands_dont_show_them
    - ask_questions_before_building
    - never_claim_fixed_without_proof
    - search_before_creating
    - never_fabricate_data

# ============================================================================
# CONFIDENCE-BASED BRANCHING (BINDING)
# ============================================================================
confidence_logic:
  doctrine:
    execute_directly_threshold: 0.80
    single_question_band: [0.50, 0.79]
    ask_all_needed_if_below: 0.50
  behavior:
    if_confidence_gte_0_80:
      ask_questions: false
      execute: true
    if_confidence_between_0_50_and_0_79:
      ask_questions: true
      max_questions: 1
      question_style: high_leverage_multiple_choice
    if_confidence_lte_0_50:
      ask_questions: true
      max_questions: 5
      question_style: multi_pass_all_at_once
      include_suggestions: true
      explanation_required: true

# ============================================================================
# INTROSPECTION
# ============================================================================
introspection:
  triggers:
    - name: summarize_workflow_context
      condition: on_user_request("summarize workflow")
      action:
        - report_active_kernels
        - report_current_context_mode
        - report_reasoning_preferences
        - emit_summary

# ============================================================================
# HOOKS (T3: Implementation paths)
# ============================================================================
hooks:
  - name: todo_injection
    condition: before_output
    implementation: cursor_memory_kernel.should_display_todos
    fallback_if_unavailable: skip
    action:
      - inject_todo_snapshot_if_due

  - name: roadmap_milestone_scan
    condition: after_user_prompt
    implementation: cursor_memory_kernel.extract_milestone_tags
    fallback_if_unavailable: skip
    action:
      - extract_milestone_tags_from_prompt
      - associate_with_relevant_todo

  - name: mistake_check
    condition: before_code_generation
    implementation: cursor_memory_client.cmd_warn
    fallback_if_unavailable: warn_only
    mcp_tool: search_memory
    mcp_query: "error mistake {task_description}"
    action:
      - check_against_repeated_mistakes
      - warn_if_pattern_detected

  - name: context_injection
    condition: session_start
    implementation: cursor_memory_client.cmd_inject
    fallback_if_unavailable: use_local_files
    action:
      - load_preferences
      - load_lessons
      - load_domain_context

# ============================================================================
# AGENT SETTINGS TRACKING
# ============================================================================
agent_settings:
  track_if_customized: true
  monitored:
    - temperature
    - output_formatting
    - memory_mode
    - schema_first
    - context_tethering
    - audit_hooks
  report_only_if_non_default: true
  include_in_summary: true
