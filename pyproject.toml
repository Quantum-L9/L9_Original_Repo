[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "l9"
version = "1.1.0"
description = "L9 AI OS"
requires-python = ">=3.12"

[tool.setuptools]
packages = { find = { where = ["."] } }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# Fix duplicate module detection (l9.agents vs agents)
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = false
python_version = "3.12"
# Pydantic plugin - CRITICAL for understanding Field() defaults
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Temporarily relax checking for legacy modules with pre-existing failures
# This prevents pre-commit from blocking unrelated changes while we gradually improve typing
[[tool.mypy.overrides]]
module = [
    "clients.memory_client",
    "api.webhook_waba",
    "api.os_routes",
    "api.routes.registry",
    "mac_agent.websocket_client",
    "agents.cursor.gmp_meta_learning",
]
ignore_errors = true

[tool.ruff]
target-version = "py312"  # Python 3.12+ (PEP 695 type params, match/case, etc.)
exclude = [
    # Archived / non-production
    "_archived",
    "**/archive",
    "**/archive/**",
    "**/*_archived*",
    "**/*archive*/**",
    "reports/_archived",
    "private/kernels/00_system/_archived",
    ".cursor/_archived_commands_backup_20260116",
    # Non-code / generated / documentation
    "l9_private/kernels",
    "readme",
    "reports",
    ".backup",
    "current_work",
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "*.egg-info",
    "codegen",
]
line-length = 88

[tool.ruff.lint]
select = [
    "F",      # Pyflakes (undefined names, unused imports)
    "E7",     # pycodestyle errors (statements)
    "E9",     # pycodestyle errors (runtime)
    "W",      # pycodestyle warnings
    "I",      # isort (import sorting) - ADR-0002
    "B",      # flake8-bugbear (common bugs)
    "UP",     # pyupgrade (modern Python syntax)
    "TCH",    # flake8-type-checking (TYPE_CHECKING imports) - ADR-0002
    "S",      # flake8-bandit (security) - replaces standalone bandit
    "DTZ",    # flake8-datetimez: enforce timezone-aware datetime (no utcnow)
]
ignore = [
    "E402",   # Module level import not at top (DORA metadata pattern - ADR-0014)
    "F841",   # Unused variable (future-proofing)
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Re-exports in __init__.py are intentional
"__init__.py" = ["F401"]
# Tests: assert IS the test mechanism
"tests/**/*.py" = ["S101"]
"**/tests/**/*.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["core", "agents", "memory", "runtime", "api", "tools", "world_model", "orchestration"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "typing.Protocol"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
fail-under = 40
exclude = ["tests", "scripts", "ci", "tools", "l9_private", "_archived", ".venv"]
