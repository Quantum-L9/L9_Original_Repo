[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l9"
version = "1.1.0"
description = "L9 AI OS"
requires-python = ">=3.12"

[tool.setuptools]
packages = { find = { where = ["."] } }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# Fix duplicate module detection (l9.agents vs agents)
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false

[tool.ruff]
exclude = [
    "l9_private/kernels",
    "readme",
    "_archived",
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "*.egg-info",
]
line-length = 88

[tool.ruff.lint]
select = ["F", "E7"]
ignore = ["E402", "F841"]  # E402: DORA metadata pattern, F841: unused variables (future-proofing)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F821"]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''/(\.git|\.venv|venv|l9_private/kernels|readme|_archived)/'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["l9_private/kernels", "readme", "_archived", ".venv", "venv"]
