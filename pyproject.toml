[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l9"
version = "1.1.0"
description = "L9 AI OS"
requires-python = ">=3.12"

[tool.setuptools]
packages = { find = { where = ["."] } }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "l9_private/kernels",
    "readme",
    "_archived",
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "*.egg-info",
    "node_modules",
    "build",
    "dist"
]
respect-gitignore = true

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "RUF",         # ruff rules
  "C901",        # McCabe complexity
  "B",           # flake8-bugbear
  "A",           # flake8-builtins
  "PIE",         # flake8-pie
  "Q",           # flake8-quotes
]
ignore = [
  "E402",        # DORA metadata pattern
  "E501",        # Line too long (mypy catches)
  "W292",        # Trailing whitespace
  "N818",        # Exception name should end with Error
  "F841",        # unused variables (future-proofing)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F821"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_context = true

# L9-specific: relax for generated code
[[tool.mypy.overrides]]
module = [
  "codegen.codegen_files.*",
  "tests.mocks.*",
]
ignore_errors = true
check_untyped_defs = false

# Core modules: STRICTEST
[[tool.mypy.overrides]]
module = [
  "core.memory.*",
  "core.packet_envelope.*",
  "core.kernels.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Third-party without stubs
[[tool.mypy.overrides]]
module = [
  "websockets.*",
  "uvicorn.*",
  "psycopg2.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''/(\.git|\.venv|venv|l9_private/kernels|readme|_archived)/'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["l9_private/kernels", "readme", "_archived", ".venv", "venv"]
