[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l9"
version = "1.1.0"
description = "L9 AI OS"
requires-python = ">=3.12"

[tool.setuptools]
packages = { find = { where = ["."] } }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
    "--cov-fail-under=70",
    "--ignore=agents/codegenagent",
    "--ignore=tests/codegen",
    "-n=auto",  # pytest-xdist for parallel execution
]
markers = [
    "asyncio: mark test as async",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "smoke: marks tests as smoke tests",
]
filterwarnings = [
    "error",  # Turn warnings into errors by default
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:langchain",
    "ignore::PendingDeprecationWarning",
]
timeout = 300  # 5 minute timeout for hanging tests
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
branch = true
parallel = true
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    ".venv/*",
    "venv/*",
    "world_model/_pack_staging/*",
    "agents/codegenagent/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
# Python version
python_version = "3.12"

# Module resolution
explicit_package_bases = true
mypy_path = "."
namespace_packages = true

# Import discovery
follow_imports = "normal"
ignore_missing_imports = false  # Changed to false for better type checking

# Warnings
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_no_return = true

# Strictness (gradual adoption)
disallow_untyped_defs = false  # Set to true when ready
disallow_any_generics = false  # Set to true when ready
check_untyped_defs = true
strict_optional = true
strict_equality = true

# Error reporting
show_error_codes = true
show_error_context = true
pretty = true
color_output = true

# Plugins
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "world_model._pack_staging.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "anthropic.*",
    "openai.*",
    "redis.*",
    "neo4j.*",
    "psycopg.*",
    "asyncpg.*",
    "structlog.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
