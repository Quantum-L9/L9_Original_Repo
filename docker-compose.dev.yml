# =============================================================================
# L9 Docker Compose - DEVELOPMENT OVERLAY
# =============================================================================
# Version: 4.0.0
# Purpose: Development-specific application services and configurations
# Usage: Combined with base docker-compose.yml
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env up
#   REQUIRED: .env must have all required vars (no missing tolerated). Run scripts/check_compose_env.sh .env
#
# FEATURES:
#   - Hot-reload enabled (volume mounts for code)
#   - Debug ports exposed
#   - Relaxed resource limits
#   - Detailed logging
# =============================================================================

services:
  # ===========================================================================
  # L9 API - Main Application (Development)
  # ===========================================================================
  l9-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ${COMPOSE_PROJECT_NAME:-l9}-api
    restart: unless-stopped
    depends_on:
      l9-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database connections (constructed from .env vars)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      MEMORY_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      
      # Neo4j
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      
      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      
      # Container flag
      L9_CONTAINER_ENV: "true"
      
      # Development flags
      LOCAL_DEV: "true"
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Hot-reload: mount source code
      - ./api:/app/api:ro
      - ./core:/app/core:ro
      - ./memory:/app/memory:ro
      - ./config:/app/config:ro
      - ./kernels:/app/kernels:ro
      - ./private:/app/private:ro
      # Persistent data
      - l9_logs:/app/logs
      - l9_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - l9-network
    labels:
      - "com.l9.service=api"
      - "com.l9.layer=application"
      - "com.l9.environment=development"

  # ===========================================================================
  # MCP Memory Server (Development)
  # ===========================================================================
  l9-mcp-memory:
    build:
      context: .
      dockerfile: Dockerfile.mcp-memory
      target: development
    container_name: ${COMPOSE_PROJECT_NAME:-l9}-mcp-memory
    restart: unless-stopped
    depends_on:
      l9-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database connections
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      MEMORY_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB}
      
      # Neo4j (REQUIRED per ADR-0082)
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # MCP Configuration
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9002
      MCP_ENV: development
      
      # Python path for MCP imports
      PYTHONPATH: /app:/app/mcp_memory
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "127.0.0.1:9002:9002"
    volumes:
      # Hot-reload: mount source code
      - ./mcp_memory:/app/mcp_memory:ro
      - ./core:/app/core:ro
      - ./memory:/app/memory:ro
      - ./config:/app/config:ro
      - ./private:/app/private:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - l9-network
    labels:
      - "com.l9.service=mcp-memory"
      - "com.l9.layer=protocol"
      - "com.l9.environment=development"

volumes:
  l9_logs:
    name: ${COMPOSE_PROJECT_NAME:-l9}-logs
  l9_data:
    name: ${COMPOSE_PROJECT_NAME:-l9}-data
