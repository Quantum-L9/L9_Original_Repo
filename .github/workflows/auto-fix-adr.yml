# =============================================================================
# L9 AI OS — Auto-fix ADR Violations
# =============================================================================
#
# Purpose: Automatically fix common ADR violations on every push
# 
# This saves 100% of tokens for mechanical fixes by running automatically
# in CI instead of requiring Cursor agent intervention.
#
# Fixes applied (in --safe mode, only adds noqa comments):
#   - ADR-0019: print() in CLI files → # noqa: ADR-0019
#   - ADR-0083: Missing timezone imports
#   - ADR-0087: f-string SQL (safe patterns) → # noqa: ADR-0087
#   - ADR-0002: TYPE_CHECKING → from __future__ import annotations
#   - ADR-0055: Bare except → except Exception:
#
# =============================================================================

name: Auto-fix ADR Violations

on:
  push:
    branches: [main, develop]
    paths:
      - "**.py"
  pull_request:
    branches: [main]
    paths:
      - "**.py"

env:
  PYTHON_VERSION: "3.12"

jobs:
  auto-fix:
    name: Auto-fix ADR violations
    runs-on: ubuntu-latest
    # Only run on push to main/develop, not on PRs (to avoid conflicts)
    if: github.event_name == 'push'
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Need full history for proper git operations
          fetch-depth: 0
          # Use a token that can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Auto-fix logging -> structlog (ADR-0019)
        run: |
          echo "🔧 Auto-fixing logging -> structlog violations..."
          python3 scripts/fix_logging_to_structlog.py --fix 2>&1 | tee structlog-fix-output.txt

      - name: Auto-fix async decorator migration
        run: |
          echo "🔧 Auto-fixing async comment -> @must_stay_async..."
          python3 scripts/fix_async_decorators.py 2>&1 | tee async-fix-output.txt

      - name: Auto-fix timezone imports (ADR-0083)
        run: |
          echo "🔧 Auto-fixing missing timezone imports..."
          python3 scripts/fix_timezone_imports.py 2>&1 | tee timezone-fix-output.txt

      - name: Auto-fix decorator @wraps
        run: |
          echo "🔧 Auto-fixing missing @wraps on decorators..."
          python3 scripts/fix_decorator_wraps.py 2>&1 | tee wraps-fix-output.txt

      - name: Run ADR auto-fix (safe mode)
        id: autofix
        run: |
          echo "Running ADR auto-fix in safe mode..."
          python3 ci/auto_fix_adr.py --all --safe 2>&1 | tee autofix-output.txt
          
          # Check if any files were modified (includes structlog fixes above)
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes needed"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Validate auto-fix didn't introduce bugs
        if: steps.autofix.outputs.changes == 'true'
        run: |
          echo "🔍 Validating auto-fix changes..."
          
          # Check 1: Syntax validation on all modified files
          echo "Checking syntax..."
          MODIFIED=$(git diff --name-only | grep '\.py$' || true)
          SYNTAX_ERRORS=0
          for file in $MODIFIED; do
            if ! python3 -c "compile(open('$file').read(), '$file', 'exec')" 2>/dev/null; then
              echo "❌ SYNTAX ERROR in $file"
              python3 -c "compile(open('$file').read(), '$file', 'exec')" 2>&1 || true
              SYNTAX_ERRORS=1
            fi
          done
          
          if [ $SYNTAX_ERRORS -eq 1 ]; then
            echo "❌ Auto-fix introduced syntax errors! Reverting..."
            git checkout -- .
            exit 1
          fi
          
          # Check 2: noqa-inside-string validation
          echo "Checking noqa placement..."
          if ! python3 ci/check_noqa_placement.py; then
            echo "❌ Auto-fix introduced noqa-inside-string bugs! Reverting..."
            git checkout -- .
            exit 1
          fi
          
          echo "✅ Auto-fix validation passed"

      - name: Commit and push fixes
        if: steps.autofix.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix(ci): auto-fix ADR violations [skip ci]"
          commit_user_name: "L9 Bot"
          commit_user_email: "bot@l9.ai"
          commit_author: "L9 Bot <bot@l9.ai>"
          # Only commit Python files
          file_pattern: "*.py"
          # Skip CI on auto-fix commits to prevent loops
          skip_dirty_check: false

  # Separate job to validate (runs on PRs too)
  validate:
    name: Validate ADR compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check ADR compliance
        run: |
          echo "Checking ADR compliance..."
          python3 ci/check_adr_compliance.py --errors-only
          
      - name: Dry-run auto-fix to show what would change
        if: failure()
        run: |
          echo "The following files would be auto-fixed:"
          python3 ci/auto_fix_adr.py --all --safe --dry-run

