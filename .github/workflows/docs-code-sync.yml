name: "Docs-Code Sync Validator"
description: "Automated consistency checks between CODE-MAP.yaml, readme_config.yaml, and source code"

on:
  pull_request:
    paths:
      - "core/**/*.py"
      - "memory/**/*.py"
      - "api/**/*.py"
      - "runtime/**/*.py"
      - "docs/CODE-MAP.yaml"
      - "config/subsystems/readme_config.yaml" # Single source of truth
      - ".github/workflows/docs-code-sync.yml"

jobs:
  validate-consistency:
    name: "Validate Docs-Code Consistency"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install pyyaml

      - name: "Validate readme_config.yaml exists and is valid"
        run: |
          if [ ! -f "config/subsystems/readme_config.yaml" ]; then
            echo "❌ Missing: config/subsystems/readme_config.yaml"
            exit 1
          fi
          python scripts/generate_subsystem_readmes.py --validate
          echo "✅ readme_config.yaml is valid"

      - name: "Validate README.md files exist for configured subsystems"
        run: |
          python .github/scripts/validate-readme-sections.py
        continue-on-error: false

      - name: "Validate no code changes to protected files"
        run: |
          python .github/scripts/validate-protected-files.py
        continue-on-error: false

      - name: "Generate AI collaboration report"
        run: |
          python .github/scripts/generate-ai-collab-report.py > /tmp/ai-collab-report.txt
          cat /tmp/ai-collab-report.txt

      - name: "Comment PR with validation results"
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/ai-collab-report.txt', 'utf-8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📋 Docs-Code Sync Report\n\n' + report
            });

  test-readme-generation:
    name: "Test README generation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install pyyaml pytest
      - name: "Validate config"
        run: python scripts/generate_subsystem_readmes.py --validate
      - name: "Dry run generation"
        run: python scripts/generate_subsystem_readmes.py --subsystem core_agents --dry-run --skip-time-verify
      - name: "Run tests"
        run: pytest tests/test_code_facts_extraction.py -v
