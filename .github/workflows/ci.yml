name: L9 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # JOB 1: VALIDATE — Run CI Gates
  # ===========================================================================
  validate:
    name: CI Gates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GH CLI
        uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: stable

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff structlog pydantic httpx pyyaml

      - name: Run CI Gates
        run: |
          echo "🔍 Running L9 CI Gates..."
          chmod +x ci/run_ci_gates.sh
          ./ci/run_ci_gates.sh --all || true

  # ===========================================================================
  # JOB 1A: CRYPTO-GUARD — Ban Weak Cryptography (MD5, SHA1)
  # ===========================================================================
  crypto-guard:
    name: Crypto Guard
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for banned MD5 usage
        run: |
          echo "🔐 Checking for banned MD5 usage..."
          
          # Find MD5 in Python files (excluding .venv and tests)
          FOUND=$(grep -r "hashlib\.md5" --include="*.py" . \
            | grep -v ".venv" \
            | grep -v "__pycache__" \
            | grep -v "# MD5 required by protocol" \
            || true)
          
          if [ -n "$FOUND" ]; then
            echo "❌ BANNED: MD5 usage detected!"
            echo ""
            echo "$FOUND"
            echo ""
            echo "Use hashlib.sha256() instead."
            echo "If MD5 is required by external protocol, add comment: # MD5 required by protocol"
            exit 1
          fi
          
          echo "✅ No banned MD5 usage found"

      - name: Check for weak SHA1 (non-HMAC)
        run: |
          echo "🔐 Checking for weak SHA1 usage..."
          
          # Find SHA1 usage (excluding HMAC and protocol requirements)
          FOUND=$(grep -r "hashlib\.sha1" --include="*.py" . \
            | grep -v ".venv" \
            | grep -v "__pycache__" \
            | grep -v "hmac" \
            | grep -v "# SHA1 required by protocol" \
            || true)
          
          if [ -n "$FOUND" ]; then
            echo "⚠️ WARNING: SHA1 usage detected (review required)"
            echo ""
            echo "$FOUND"
            echo ""
            echo "Consider using SHA256 unless required by external protocol."
          fi
          
          echo "✅ SHA1 check complete"

      - name: Check for deprecated TaskKind usage
        run: |
          echo "🚫 Checking for deprecated TaskKind usage..."
          
          # Check 1: Import of TaskKind from core.agents.schemas (DEPRECATED)
          # NOT core.schemas.tasks.TaskKind which is for internal routing
          IMPORTS=$(grep -rE "from core\.agents\.schemas import.*TaskKind" --include="*.py" . \
            | grep -v ".venv" \
            | grep -v "__pycache__" \
            | grep -v "current_work/" \
            | grep -v "# TaskKind: backward compat" \
            || true)
          
          # Check 2: Usage of deprecated TaskKind enum values
          # CONVERSATION, QUERY, EXECUTION, RESEARCH are ONLY in core.agents.schemas (deprecated)
          # RESULT, ERROR, COMMAND are in core.schemas.tasks (NOT deprecated)
          USAGE=$(grep -rE "TaskKind\.(CONVERSATION|QUERY|EXECUTION|RESEARCH)" --include="*.py" . \
            | grep -v ".venv" \
            | grep -v "__pycache__" \
            | grep -v "core/agents/schemas.py" \
            | grep -v "current_work/" \
            | grep -v "# TaskKind: backward compat" \
            || true)
          
          FAILED=0
          
          if [ -n "$IMPORTS" ]; then
            echo "❌ DEPRECATED: TaskKind import from core.agents.schemas!"
            echo ""
            echo "$IMPORTS"
            FAILED=1
          fi
          
          if [ -n "$USAGE" ]; then
            echo "❌ DEPRECATED: TaskKind enum values (CONVERSATION/QUERY/EXECUTION/RESEARCH)!"
            echo ""
            echo "$USAGE"
            FAILED=1
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "========================================="
            echo "core.agents.schemas.TaskKind is DEPRECATED."
            echo "Use AgentType instead:"
            echo "  from core.agents.schemas import AgentType"
            echo ""
            echo "Migration mapping:"
            echo "  TaskKind.CONVERSATION → AgentType.ASSISTANT"
            echo "  TaskKind.QUERY        → AgentType.ANALYST"
            echo "  TaskKind.EXECUTION    → AgentType.EXECUTOR"
            echo "  TaskKind.RESEARCH     → AgentType.RESEARCHER"
            echo "  TaskKind.COMMAND      → AgentType.OPERATOR"
            echo ""
            echo "Parameter change:"
            echo "  kind=TaskKind.X → agent_type=AgentType.Y"
            echo ""
            echo "Note: core.schemas.tasks.TaskKind is NOT deprecated (internal routing)"
            echo "      TaskKind.RESULT, TaskKind.ERROR, TaskKind.COMMAND from tasks.py are OK"
            echo "Escape hatch: Add comment '# TaskKind: backward compat'"
            exit 1
          fi
          
          echo "✅ No deprecated TaskKind usage found"

  # ===========================================================================
  # JOB 1B: DORA-CHECK — DORA Block Compliance
  # ===========================================================================
  dora-check:
    name: DORA Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check DORA compliance
        run: |
          echo "🔍 Checking DORA block compliance..."
          python ci/dora_compliance_check.py --check --path .
        continue-on-error: true  # Don't block CI yet - report only

  # ===========================================================================
  # JOB 2: DOCKER-CHECK — Validate Docker Files
  # ===========================================================================
  docker-check:
    name: Docker Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Docker Validator
        run: |
          echo "🐳 Validating Docker files..."
          chmod +x scripts/docker-validator.sh
          ./scripts/docker-validator.sh check-only

  # ===========================================================================
  # JOB 3: TEST — Comprehensive Test Suite
  # ===========================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [validate, docker-check]
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: l9
          POSTGRES_PASSWORD: l9test
          POSTGRES_DB: l9_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov httpx structlog pydantic tenacity asyncpg redis

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql://l9:l9test@localhost:5432/l9_test
          REDIS_URL: redis://localhost:6379
          TESTING: "true"
        run: |
          echo "🧪 Running pytest with coverage..."
          pytest tests/ -v --tb=short --ignore=tests/e2e \
            --cov=core --cov=memory --cov=runtime --cov=api \
            --cov-report=xml --cov-report=term-missing \
            || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: l9-coverage
          fail_ci_if_error: false
          verbose: true

      # SonarCloud removed - 439K LOC exceeds free tier limit for private repos
      # Config preserved in sonar-project.properties for future use if repo goes public

  # ===========================================================================
  # JOB 3B: PATH-SAFETY — Targeted Tests + Semgrep Guard
  # ===========================================================================
  path-safety-tests:
    name: Path Safety Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx pydantic structlog

      - name: Run path safety tests
        run: |
          pytest -q tests/core/security/test_path_safety.py tests/api/test_factory_path_safety.py tests/scripts/test_factory_extract_cli.py

  path-safety-guard:
    name: Path Safety Semgrep Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep path-join guard
        run: |
          semgrep --config .sec/semgrep.yaml api/routes scripts/research core/security

  # ===========================================================================
  # JOB 4: DOCKER-SMOKE — Full Docker Smoke Test
  # ===========================================================================
  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [validate, docker-check]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test docker-compose.yml
        run: |
          # Create minimal compose for CI (without secrets)
          cat > docker-compose.yml << 'EOF'
          version: "3.8"
          services:
            postgres:
              image: pgvector/pgvector:pg16
              environment:
                POSTGRES_USER: l9
                POSTGRES_PASSWORD: l9test
                POSTGRES_DB: l9
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U l9"]
                interval: 5s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 5s
                retries: 5

            l9-api:
              build:
                context: .
                dockerfile: runtime/Dockerfile
              environment:
                DATABASE_URL: postgresql://l9:l9test@postgres:5432/l9
                REDIS_URL: redis://redis:6379
                TESTING: "true"
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 10s
                timeout: 5s
                retries: 10
          EOF

      - name: Build and test Docker stack
        run: |
          echo "🐳 Building Docker stack..."
          docker compose build
          
          echo "🚀 Starting services..."
          docker compose up -d
          
          echo "⏳ Waiting for services..."
          sleep 30
          
          echo "🧪 Running health checks..."
          docker compose ps
          
          echo "🧹 Cleanup..."
          docker compose down -v

  # ===========================================================================
  # JOB 4B: MUTATION-TESTS — Mutation Testing (PRs only)
  # ===========================================================================
  mutation-tests:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: [test]  # Only run after tests pass
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mutmut>=2.4.5 pytest pytest-asyncio

      - name: Run mutation tests on critical paths
        id: mutation
        run: |
          echo "🧬 Running mutation tests on critical paths..."
          
          # Run mutmut on critical paths only (full codebase would take hours)
          mutmut run \
            --paths-to-mutate core/agents/executor.py \
            --tests-dir tests/ \
            --timeout 30 \
            --no-progress \
            2>&1 || true
            
      - name: Check mutation score threshold
        run: |
          # Get results
          RESULTS=$(mutmut results --json 2>/dev/null || echo '{"killed":0,"total":1}')
          KILLED=$(echo "$RESULTS" | jq -r '.killed // 0')
          TOTAL=$(echo "$RESULTS" | jq -r '.total // 1')
          
          # Calculate score
          if [ "$TOTAL" -eq 0 ]; then
            SCORE="100"
          else
            SCORE=$(echo "scale=2; $KILLED * 100 / $TOTAL" | bc)
          fi
          
          echo "📊 Mutation Testing Results:"
          echo "   Killed: $KILLED / $TOTAL"
          echo "   Score:  $SCORE%"
          
          # Check threshold (85%)
          PASSED=$(echo "$SCORE >= 85" | bc -l)
          
          if [ "$PASSED" -eq 0 ]; then
            echo ""
            echo "❌ FAILED: Mutation score $SCORE% is below 85% threshold"
            echo ""
            echo "Surviving mutants indicate weak tests. To fix:"
            echo "  1. Run: mutmut results"
            echo "  2. For each survivor: mutmut show <id>"
            echo "  3. Add tests that catch the mutation"
            exit 1
          fi
          
          echo "✅ PASSED: Mutation score $SCORE% meets 85% threshold"

  # ===========================================================================
  # JOB 5: SECURITY — Dependency Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          echo "🔒 Scanning for vulnerabilities..."
          pip-audit || true

  # ===========================================================================
  # JOB 6: CI COMPLETE — Summary Gate
  # ===========================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [validate, crypto-guard, dora-check, docker-check, test, mutation-tests, docker-smoke, security]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    L9 CI PIPELINE SUMMARY                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Jobs:"
          echo "  ├─ Validate:       ${{ needs.validate.result }}"
          echo "  ├─ Crypto Guard:   ${{ needs.crypto-guard.result }}"
          echo "  ├─ DORA Check:     ${{ needs.dora-check.result }}"
          echo "  ├─ Docker Check:   ${{ needs.docker-check.result }}"
          echo "  ├─ Test:           ${{ needs.test.result }}"
          echo "  ├─ Mutation Tests: ${{ needs.mutation-tests.result || 'skipped (push)' }}"
          echo "  ├─ Docker Smoke:   ${{ needs.docker-smoke.result }}"
          echo "  └─ Security:       ${{ needs.security.result }}"
          echo ""
          
          # Fail if critical jobs failed
          if [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "❌ CI Gates failed"
            exit 1
          fi
          
          if [[ "${{ needs.crypto-guard.result }}" == "failure" ]]; then
            echo "❌ Crypto Guard failed (banned MD5 detected)"
            exit 1
          fi
          
          if [[ "${{ needs.docker-check.result }}" == "failure" ]]; then
            echo "❌ Docker validation failed"
            exit 1
          fi
          
          echo "✅ All critical checks passed"

