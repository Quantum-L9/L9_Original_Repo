# =============================================================================
# L9 AI OS — Complete CI Pipeline
# =============================================================================
#
# Version: 1.1.0
# Created: 2026-01-06
# Updated: 2026-01-06 — Use existing L9 scripts
#
# JOBS:
#   1. validate      - CI gates (syntax, imports, wiring)
#   2. docker-check  - Docker file validation
#   3. test          - Comprehensive test suite
#   4. docker-smoke  - Full Docker smoke test
#   5. security      - Dependency vulnerability scan
#
# SCRIPTS USED:
#   - ci/run_ci_gates.sh
#   - scripts/docker-validator.sh
#   - scripts/test_everything.sh
#   - scripts/precommit_docker_smoke.sh
#
# =============================================================================

name: L9 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # JOB 1: VALIDATE — Run CI Gates
  # ===========================================================================
  validate:
    name: CI Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GH CLI
        uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: stable

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff structlog pydantic httpx pyyaml

      - name: Run CI Gates
        run: |
          echo "🔍 Running L9 CI Gates..."
          chmod +x ci/run_ci_gates.sh
          ./ci/run_ci_gates.sh --all

  # ===========================================================================
  # JOB 1B: LINT-TYPECHECK-TEST — Required status check for branch protection
  # ===========================================================================
  # Use this job as a required status check so: make lint && make typecheck && make test-fast
  # must pass before merge. Enforces code quality and fast tests on every PR.
  lint-typecheck-test:
    name: Lint, typecheck, test-fast
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Lint (ruff)
        run: |
          ruff check . --output-format=concise
          ruff format --check .

      - name: Typecheck (mypy)
        run: |
          mypy api/ core/ memory/ runtime/ \
            --follow-imports=skip \
            --ignore-missing-imports \
            --show-error-codes

      - name: Test (fast)
        run: |
          pytest tests/ -v --tb=short -m "not slow"

      - name: Docstring coverage (interrogate)
        run: |
          pip install interrogate
          interrogate -vv core/ memory/ api/ --fail-under 40

  # ===========================================================================
  # JOB 1A: ADR-COMPLIANCE — Architecture Decision Records Enforcement
  # ===========================================================================
  # Missing __dora_meta__ / meta blocks violate ADR-0014 and fail this job.
  # Require this job in branch protection to block merges without DORA headers.
  adr-compliance:
    name: ADR Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml structlog aiofiles psutil pydantic-settings pydantic

      - name: Check Python syntax (Gate 0)
        run: |
          echo "🐍 Checking Python syntax..."
          python3 ci/check_syntax.py

      - name: Check ADR compliance (errors only)
        run: |
          echo "📋 Checking ADR compliance..."
          python3 ci/check_adr_compliance.py --errors-only --verbose

      - name: Check missing imports
        run: |
          echo "📦 Checking for missing imports..."
          python3 ci/check_imports.py

      - name: Check memory pipeline bypass (GMP-129)
        run: |
          echo "🛡️ Checking for memory pipeline bypass violations..."
          python3 ci/check_memory_bypass.py

      - name: Check DAG single validation point (ADR-0012)
        run: |
          echo "🔍 Checking DAG validation single-point enforcement (ADR-0012)..."
          python3 ci/check_dag_validation_single_point.py

      - name: Check hardcoded credentials (ADR-0090)
        run: python3 ci/check_hardcoded_credentials.py

      - name: Check datetime.utcnow() (ADR-0083)
        run: python3 ci/check_datetime_utcnow.py

      - name: Check pickle usage (ADR-0088)
        run: python3 ci/check_pickle_usage.py

      - name: Check f-string SQL (ADR-0087)
        run: python3 ci/check_fstring_sql.py

      - name: Check print() usage (ADR-0019)
        run: python3 ci/check_print_usage.py

      - name: Check logging module (ADR-0019)
        run: python3 ci/check_logging_module.py

      - name: Check TYPE_CHECKING pattern (ADR-0002)
        run: python3 ci/check_type_checking_pattern.py

      - name: Check logging -> structlog (ADR-0019 auto-fixable)
        run: |
          echo "🔍 Checking for logging -> structlog violations..."
          python3 scripts/fix_logging_to_structlog.py
          echo "Fix: Run 'python3 scripts/fix_logging_to_structlog.py --fix' locally"

      - name: ADR drift detection (auto_fix_adr dry-run)
        run: |
          echo "🔄 Checking for unfixed ADR violations (drift detection)..."
          # Run auto-fixer in dry-run mode — if it finds fixable violations,
          # that means code was committed without running the fixer
          OUTPUT=$(python3 ci/auto_fix_adr.py --all --dry-run 2>&1 || true)
          WOULD_FIX=$(echo "$OUTPUT" | grep -c "Would" || true)
          if [ "$WOULD_FIX" -gt 0 ]; then
            echo "⚠️  ADR drift detected: $WOULD_FIX files have auto-fixable violations"
            echo "$OUTPUT" | grep "Would"
            echo ""
            echo "Fix: Run 'python3 ci/auto_fix_adr.py --all' locally before committing"
          else
            echo "✅ No ADR drift detected"
          fi

      - name: Check noqa placement (GMP-CI-2026-02)
        run: python3 ci/check_noqa_placement.py

      - name: Check stale noqa comments (GMP-115)
        run: python3 ci/check_stale_noqa.py

      - name: Check global state patterns
        run: python3 ci/check_global_state.py

      - name: Check ADR enforcement manifest coverage
        run: |
          echo "📋 Checking ADR enforcement manifest coverage..."
          python3 ci/check_adr_enforcement_manifest.py

      - name: Auto-stub missing ADRs in manifest (dry-run)
        run: |
          echo "📝 Checking for ADRs missing from enforcement manifest..."
          python3 ci/auto_stub_adr_enforcement.py --dry-run

      - name: Check GMP report naming convention
        run: |
          echo "📝 Checking GMP report naming convention..."
          python3 ci/check_report_naming.py

      # =======================================================================
      # GATES FROM run_ci_gates.sh — previously only ran with explicit file args
      # =======================================================================

      - name: Check forbidden imports (Gate 5)
        run: |
          echo "🚫 Checking for forbidden imports (logging, aiohttp, print)..."
          python3 ci/check_forbidden_imports.py

      - name: Check tool wiring consistency (Gate 6)
        run: |
          echo "🔧 Checking tool wiring consistency across registries..."
          python3 ci/check_tool_wiring.py

      - name: Check deprecated services (Gate 8)
        run: |
          echo "🗑️ Checking for deprecated service references (Supabase, n8n)..."
          python3 ci/check_no_deprecated_services.py

      - name: Check schema deprecation (Gate 9)
        run: |
          echo "📦 Checking for deprecated PacketEnvelope v1 imports..."
          python3 ci/check_schema_deprecation.py

      - name: Check tool naming convention (Gate 10)
        run: |
          echo "🏷️ Checking tool IDs for OpenAI naming compliance..."
          python3 ci/check_tool_naming.py

      - name: Check substrate API usage (Gate 13)
        run: |
          echo "🔌 Checking for incorrect substrate API usage (.write vs .write_packet)..."
          python3 ci/check_substrate_api.py

      - name: Check packet type naming (Gate 15)
        run: |
          echo "📋 Checking 'kind' vs 'packet_type' naming in PacketEnvelope..."
          python3 ci/check_packet_type_naming.py

      - name: Check protected files (Gate 16)
        run: |
          echo "🔒 Checking for unauthorized modifications to protected files..."
          python3 ci/check_protected_files.py
        continue-on-error: true  # Reports violations — enforcement via branch protection review

      - name: Check definition of done (Gate 17 / ADR-0091)
        run: |
          echo "✅ Checking Definition of Done criteria..."
          python3 ci/check_definition_of_done.py

      - name: Check dependency patterns (lazy singletons)
        run: |
          echo "🔗 Checking dependency access patterns (lazy singletons vs Depends)..."
          python3 ci/check_dependency_patterns.py

      - name: Validate policy YAML schemas
        run: |
          echo "📜 Validating policy YAML schemas in config/policies/..."
          python3 ci/validate_policy_schemas.py

      - name: Repository contract validation
        run: |
          echo "📋 Validating repository method/param contracts..."
          python -m pytest tests/ci/test_repository_contract_calls.py -v --tb=short

      # =======================================================================
      # AUTO-FIXABLE SCRIPT CHECKS (dry-run mode — fail if violations exist)
      # =======================================================================

      - name: Check async decorator migration
        run: |
          echo "🔄 Checking for un-migrated async comments..."
          python3 scripts/fix_async_decorators.py --dry-run

      - name: Check decorator @wraps compliance
        run: |
          echo "🎀 Checking decorators for missing @wraps..."
          python3 scripts/fix_decorator_wraps.py --dry-run

      - name: Check timezone imports (ADR-0083)
        run: |
          echo "🕐 Checking for missing timezone imports..."
          python3 scripts/fix_timezone_imports.py --dry-run

      - name: Check untyped decorators (mypy)
        run: |
          echo "🔍 Scanning for untyped decorators..."
          python3 scripts/fix_untyped_decorators.py scan
        continue-on-error: true  # Informational — mypy coverage improvement

      - name: Check logger instantiation (ADR-0019)
        run: |
          echo "📝 Checking for missing logger instantiation..."
          python3 scripts/audit/ensure_logger_instantiated.py

      - name: Validate DORA blocks (ADR-0014)
        run: |
          echo "📋 Validating DORA header/footer/trace blocks..."
          python3 scripts/audit/validate_dora_complete.py --repo .

      - name: Check N+1 query patterns
        run: |
          echo "🔍 Checking for N+1 query patterns..."
          python3 scripts/check_n_plus_1.py --all
        continue-on-error: true  # Heuristic — may have false positives

      # =======================================================================
      # TOOLS VALIDATION CHECKS
      # =======================================================================

      - name: Check ADR compliance (enhanced scanner)
        run: |
          echo "📋 Running enhanced ADR compliance scanner..."
          python3 tools/adr/adr_scanner.py --strict
        continue-on-error: true  # Comprehensive — may overlap with check_adr_compliance

      - name: Check package __all__ exports
        run: |
          echo "📦 Checking __all__ export consistency..."
          python3 tools/validation/audit_package_exports.py
        continue-on-error: true  # Pre-existing export gaps

      - name: Check config mismatches
        run: |
          echo "⚙️ Checking for configuration inconsistencies..."
          python3 tools/bug_detection/find_config_mismatches.py
        continue-on-error: true  # Heuristic detection

      - name: Check spec-code drift
        run: |
          echo "📐 Checking Module-Spec vs implementation drift..."
          python3 tools/spec_validator/diff_spec_code.py
        continue-on-error: true  # Spec alignment is aspirational

  # ===========================================================================
  # JOB 1B: CRYPTO-GUARD — Ban Weak Cryptography (MD5, SHA1)
  # ===========================================================================
  crypto-guard:
    name: Crypto Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check crypto usage (MD5/SHA1/TaskKind)
        run: python3 ci/check_crypto_usage.py

  # ===========================================================================
  # JOB 1B: DORA-CHECK — DORA Block Compliance
  # ===========================================================================
  dora-check:
    name: DORA Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check DORA compliance
        run: |
          echo "🔍 Checking DORA block compliance..."
          python ci/check_dora_compliance.py --check --path .
        continue-on-error: true # Don't block CI yet - report only

  # ===========================================================================
  # JOB 2: DOCKER-CHECK — Validate Docker Files
  # ===========================================================================
  docker-check:
    name: Docker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Docker Validator
        run: |
          echo "🐳 Validating Docker files..."
          chmod +x scripts/docker-validator.sh
          ./scripts/docker-validator.sh check-only

  # ===========================================================================
  # JOB 3: TEST — Comprehensive Test Suite
  # ===========================================================================
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, docker-check]
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: l9
          POSTGRES_PASSWORD: l9test
          POSTGRES_DB: l9_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov httpx structlog pydantic tenacity asyncpg redis

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql://l9:l9test@localhost:5432/l9_test
          REDIS_URL: redis://localhost:6379
          TESTING: "true"
        run: |
          echo "🧪 Running pytest with coverage..."
          pytest tests/ -v --tb=short --ignore=tests/e2e \
            --cov=core --cov=memory --cov=runtime --cov=api \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: l9-coverage
          fail_ci_if_error: false
          verbose: true

      # SonarCloud removed - 439K LOC exceeds free tier limit for private repos
      # Config preserved in sonar-project.properties for future use if repo goes public

  # ===========================================================================
  # JOB 3B: PATH-SAFETY — Targeted Tests + Semgrep Guard
  # ===========================================================================
  path-safety-tests:
    name: Path Safety Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx pydantic structlog

      - name: Run path safety tests
        run: |
          pytest -q tests/core/security/test_path_safety.py tests/api/test_factory_path_safety.py tests/scripts/test_factory_extract_cli.py

  path-safety-guard:
    name: Path Safety Semgrep Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep path-join guard
        run: |
          semgrep --config .sec/semgrep.yaml api/routes scripts/research core/security

  # ===========================================================================
  # JOB 3C: L9-PATTERNS — Architecture Pattern Enforcement (ADR-0083-0088)
  # ===========================================================================
  l9-patterns:
    name: L9 Pattern Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run L9 Pattern Rules
        run: |
          echo "🔍 Running L9 pattern enforcement (ADR-0083 to ADR-0088)..."
          semgrep --config .semgrep/l9-rules.yaml \
            --error \
            --exclude tests/ \
            --exclude scripts/ \
            api/ core/ runtime/ services/ agents/ memory/ || exit 1
          echo "✅ All L9 patterns pass"

  # ===========================================================================
  # JOB 4: DOCKER-SMOKE — Full Docker Smoke Test
  # ===========================================================================
  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, docker-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test docker-compose.yml
        run: |
          # Create minimal compose for CI (without secrets)
          cat > docker-compose.yml << 'EOF'
          version: "3.8"
          services:
            postgres:
              image: pgvector/pgvector:pg16
              environment:
                POSTGRES_USER: l9
                POSTGRES_PASSWORD: l9test
                POSTGRES_DB: l9
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U l9"]
                interval: 5s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 5s
                retries: 5

            l9-api:
              build:
                context: .
                dockerfile: Dockerfile
              environment:
                DATABASE_URL: postgresql://l9:l9test@postgres:5432/l9
                REDIS_URL: redis://redis:6379
                TESTING: "true"
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 10s
                timeout: 5s
                retries: 10
          EOF

      - name: Build and test Docker stack
        run: |
          echo "🐳 Building Docker stack..."
          docker compose build

          echo "🚀 Starting services..."
          docker compose up -d

          echo "⏳ Waiting for services..."
          sleep 30

          echo "🧪 Running health checks..."
          docker compose ps

          echo "🧹 Cleanup..."
          docker compose down -v

  # ===========================================================================
  # JOB 4B: MUTATION-TESTS — Mutation Testing (PRs only)
  # ===========================================================================
  mutation-tests:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test] # Only run after tests pass
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mutmut>=2.4.5 pytest pytest-asyncio

      - name: Run mutation tests on critical paths
        id: mutation
        run: |
          echo "🧬 Running mutation tests on critical paths..."

          # Run mutmut on critical paths only (full codebase would take hours)
          mutmut run \
            --paths-to-mutate core/agents/executor.py \
            --tests-dir tests/ \
            --timeout 30 \
            --no-progress \
            2>&1 || true

      - name: Check mutation score threshold
        run: |
          # Get results
          RESULTS=$(mutmut results --json 2>/dev/null || echo '{"killed":0,"total":1}')
          KILLED=$(echo "$RESULTS" | jq -r '.killed // 0')
          TOTAL=$(echo "$RESULTS" | jq -r '.total // 1')

          # Calculate score
          if [ "$TOTAL" -eq 0 ]; then
            SCORE="100"
          else
            SCORE=$(echo "scale=2; $KILLED * 100 / $TOTAL" | bc)
          fi

          echo "📊 Mutation Testing Results:"
          echo "   Killed: $KILLED / $TOTAL"
          echo "   Score:  $SCORE%"

          # Check threshold (85%)
          PASSED=$(echo "$SCORE >= 85" | bc -l)

          if [ "$PASSED" -eq 0 ]; then
            echo ""
            echo "❌ FAILED: Mutation score $SCORE% is below 85% threshold"
            echo ""
            echo "Surviving mutants indicate weak tests. To fix:"
            echo "  1. Run: mutmut results"
            echo "  2. For each survivor: mutmut show <id>"
            echo "  3. Add tests that catch the mutation"
            exit 1
          fi

          echo "✅ PASSED: Mutation score $SCORE% meets 85% threshold"

  # ===========================================================================
  # JOB 5: SECURITY — Dependency Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          echo "🔒 Scanning for vulnerabilities..."
          pip-audit --strict --desc

  # ===========================================================================
  # JOB 5B: AI GUARDRAILS — Model Quality Gates
  # ===========================================================================
  ai-guardrails:
    name: AI Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    # Only run if OPENAI_API_KEY is set (skip on forks)
    if: ${{ vars.AI_GUARDRAILS_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyyaml structlog pydantic pydantic-settings openai

      - name: Run AI Guardrails (dry-run if no API key)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🛡️ Running AI Guardrails..."

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "⚠️ OPENAI_API_KEY not set, running in dry-run mode"
            python ci/ai_guardrails/runner.py --dry-run
          else
            python ci/ai_guardrails/runner.py
          fi

  # ===========================================================================
  # JOB 5C: SECRETS-SCAN — GitGuardian
  # ===========================================================================
  secrets-scan:
    name: Secrets Scan (GitGuardian)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ===========================================================================
  # JOB 5D: COMMITLINT — Conventional Commit Enforcement (PRs only)
  # ===========================================================================
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # ===========================================================================
  # JOB 6: CI COMPLETE — Summary Gate
  # ===========================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        validate,
        lint-typecheck-test,
        adr-compliance,
        l9-patterns,
        crypto-guard,
        dora-check,
        docker-check,
        test,
        path-safety-tests,
        path-safety-guard,
        mutation-tests,
        docker-smoke,
        security,
        secrets-scan,
        commitlint,
        ai-guardrails,
      ]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    L9 CI PIPELINE SUMMARY                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Jobs:"
          echo "  ├─ Validate:        ${{ needs.validate.result }}"
          echo "  ├─ Lint/Type/Test:  ${{ needs.lint-typecheck-test.result }}"
          echo "  ├─ ADR Compliance:  ${{ needs.adr-compliance.result }}"
          echo "  ├─ L9 Patterns:     ${{ needs.l9-patterns.result }}"
          echo "  ├─ Crypto Guard:    ${{ needs.crypto-guard.result }}"
          echo "  ├─ DORA Check:      ${{ needs.dora-check.result }}"
          echo "  ├─ Docker Check:    ${{ needs.docker-check.result }}"
          echo "  ├─ Test:            ${{ needs.test.result }}"
          echo "  ├─ Path Safety:     ${{ needs.path-safety-tests.result }}"
          echo "  ├─ Semgrep Guard:   ${{ needs.path-safety-guard.result }}"
          echo "  ├─ Mutation Tests:  ${{ needs.mutation-tests.result || 'skipped (push)' }}"
          echo "  ├─ Docker Smoke:    ${{ needs.docker-smoke.result }}"
          echo "  ├─ Security:        ${{ needs.security.result }}"
          echo "  ├─ Secrets Scan:    ${{ needs.secrets-scan.result }}"
          echo "  ├─ Commitlint:      ${{ needs.commitlint.result || 'skipped (push)' }}"
          echo "  └─ AI Guardrails:   ${{ needs.ai-guardrails.result || 'skipped' }}"
          echo ""

          # Fail if critical jobs failed
          if [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "❌ CI Gates failed"
            exit 1
          fi

          if [[ "${{ needs.lint-typecheck-test.result }}" == "failure" ]]; then
            echo "❌ Lint/Typecheck/Test failed"
            exit 1
          fi

          if [[ "${{ needs.adr-compliance.result }}" == "failure" ]]; then
            echo "❌ ADR Compliance failed (security or import violations)"
            exit 1
          fi

          if [[ "${{ needs.l9-patterns.result }}" == "failure" ]]; then
            echo "❌ L9 Patterns failed (ADR-0083 to ADR-0088 violations)"
            exit 1
          fi

          if [[ "${{ needs.crypto-guard.result }}" == "failure" ]]; then
            echo "❌ Crypto Guard failed (banned MD5 detected)"
            exit 1
          fi

          if [[ "${{ needs.docker-check.result }}" == "failure" ]]; then
            echo "❌ Docker validation failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Test suite failed"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "❌ Security scan failed (known vulnerabilities)"
            exit 1
          fi

          if [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "❌ Secrets scan failed (leaked credentials)"
            exit 1
          fi

          echo "✅ All critical checks passed"

