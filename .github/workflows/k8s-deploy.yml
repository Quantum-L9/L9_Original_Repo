# =============================================================================
# L9 Kubernetes Deployment Workflow
# =============================================================================
# This workflow deploys L9 to Kubernetes using Helm
# Triggered on: successful Docker build, manual workflow dispatch
# =============================================================================

name: Kubernetes Deployment

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: "Version to deploy (leave empty for latest)"
        required: false
        type: string

jobs:
  # ===========================================================================
  # Deploy to Development
  # ===========================================================================
  deploy-dev:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development')
    environment:
      name: development
      url: https://dev.l9.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DEV }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.13.0"

      - name: Deploy with Helm
        run: |
          helm upgrade --install l9-dev ./deploy/helm/l9-platform \
            -f ./deploy/helm/l9-platform/values-dev.yaml \
            --namespace l9-dev \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set api.image.tag=${{ github.event.inputs.version || 'latest' }} \
            --set mcpMemory.image.tag=${{ github.event.inputs.version || 'latest' }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/l9-dev-api -n l9-dev
          kubectl get pods -n l9-dev

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.l9.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.13.0"

      - name: Deploy with Helm
        run: |
          helm upgrade --install l9-staging ./deploy/helm/l9-platform \
            -f ./deploy/helm/l9-platform/values.yaml \
            --namespace l9-staging \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set global.environment=staging \
            --set api.image.tag=${{ github.event.inputs.version || github.sha }} \
            --set mcpMemory.image.tag=${{ github.event.inputs.version || github.sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/l9-staging-api -n l9-staging
          kubectl get pods -n l9-staging

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            --namespace=l9-staging \
            -- curl -f http://l9-staging-api:8000/health

  # ===========================================================================
  # Deploy to Production
  # ===========================================================================
  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://l9.ai
    needs: [] # Manual approval required

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_PROD }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.13.0"

      - name: Deploy with Helm (Blue-Green)
        run: |
          # Deploy to green environment
          helm upgrade --install l9-prod-green ./deploy/helm/l9-platform \
            -f ./deploy/helm/l9-platform/values-production.yaml \
            --namespace l9-prod \
            --create-namespace \
            --wait \
            --timeout 15m \
            --set api.image.tag=${{ github.event.inputs.version || github.sha }} \
            --set mcpMemory.image.tag=${{ github.event.inputs.version || github.sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/l9-prod-green-api -n l9-prod
          kubectl get pods -n l9-prod

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            --namespace=l9-prod \
            -- curl -f http://l9-prod-green-api:8000/health

      - name: Switch traffic to green
        run: |
          kubectl patch service l9-prod-api -n l9-prod \
            -p '{"spec":{"selector":{"app.kubernetes.io/instance":"l9-prod-green"}}}'

      - name: Wait for traffic switch
        run: sleep 30

      - name: Delete blue deployment
        run: |
          helm uninstall l9-prod-blue -n l9-prod || true

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: "L9 Production Deployment: ${{ job.status }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
