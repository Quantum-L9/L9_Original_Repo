name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels:
      - "feat"
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "🔒 Security"
    labels:
      - "security"
  - title: "📚 Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "🧪 Testing"
    labels:
      - "test"
      - "testing"
  - title: "🏗️ Infrastructure"
    labels:
      - "ci"
      - "infra"
      - "build"
  - title: "♻️ Refactoring"
    labels:
      - "refactor"
  - title: "⚡ Performance"
    labels:
      - "perf"
      - "performance"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "feat"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "fix"
      - "bugfix"
      - "docs"
      - "ci"
      - "refactor"
  default: patch

autolabeler:
  - label: "feat"
    title:
      - "/^feat/i"
  - label: "fix"
    title:
      - "/^fix/i"
  - label: "docs"
    title:
      - "/^docs/i"
  - label: "ci"
    title:
      - "/^ci/i"
      - "/^build/i"
  - label: "refactor"
    title:
      - "/^refactor/i"
  - label: "test"
    title:
      - "/^test/i"
  - label: "perf"
    title:
      - "/^perf/i"
  - label: "chore"
    title:
      - "/^chore/i"

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
