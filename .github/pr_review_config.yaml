# L9 PR Review Configuration
protected_files:
  - "api/websocket_orchestrator.py"
  - "docker-compose.yml"
  - "core/kernel_loader.py"
  - "memory/substrate_service.py"
  - "core/schemas/packet_envelope.py"
  - "private/kernels/**/*.py"

audit_scopes:
  security:
    - sql_injection
    - path_traversal
    - secret_exposure
    - unsafe_eval
    - command_injection

  performance:
    - async_patterns
    - caching_opportunities
    - batch_operations
    - connection_pooling

  architecture:
    - packet_envelope_compliance
    - memory_substrate_usage
    - governance_checks
    - kernel_invariants
    - dependency_injection

review_stages:
  - name: "Gemini Code Assist"
    type: "github_app"
    auto_trigger: true

  - name: "Gemini Auto-Apply"
    type: "api"
    script: "scripts/pr_review/gemini_auto_editor.py"

  - name: "Perplexity Audit"
    type: "api"
    script: "scripts/pr_review/perplexity_reviewer.py"
    mode: "full"
