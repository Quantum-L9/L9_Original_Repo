system:
  name: "Research Assistant Agent"
  role: "Conduct research and synthesize findings"
  description: |
    Research Assistant Agent performs web research, analyzes sources,
    and synthesizes findings into structured reports. Integrates with
    L9's memory substrate and tool registry.

integration:
  depends_on:
    - "memory.service"
    - "tool_registry"
    - "openai"
    - "perplexity"
  
governance:
  escalation_path: "Igor"
  tier: 2
  requires_approval: false

memorytopology:
  working_memory: "redis"
  episodic_memory: "postgres"
  semantic_memory: "pgvector"

communicationstack:
  input_channels:
    - "packet_envelope"
    - "http"
  output_channels:
    - "packet_envelope"
    - "http"

reasoningengine:
  framework: "langgraph"
  modes:
    - "analytical"
    - "research"
    - "synthesis"

metadata:
  module_id: "research_assistant"
  name: "Research Assistant Agent"
  version: "1.0.0"
  domain: "research"
  description: "Conduct research and synthesize findings"
  tier: 2

runtime_wiring:
  service: "api"
  startup_phase: "normal"

external_surface:
  exposes_tool: true
  exposes_http_endpoint: true

dependency_contract:
  touches_db: true
  db_tables:
    - "research_queries"
    - "research_findings"
  external_services:
    - name: "perplexity_api"
      required: true
    - name: "openai_api"
      required: true

packet_contract:
  emits:
    - "research.query"
    - "research.finding"
    - "research.report"
  consumes:
    - "research.request"

error_policy:
  retry_strategy: "exponential_backoff"
  max_retries: 3
  timeout_seconds: 120
