
[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "C901", "B", "S", "UP"]
ignore = ["E501", "W605"]
fix = true
fixable = ["F", "E", "W", "C901", "B", "UP"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = ["integration: integration tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
