        - PacketEnvelope ingestion and storage
        - Semantic embedding generation
        - Memory retrieval and search

        ### This Module Does NOT Own
        - Agent execution logic
        - Tool dispatch
        - API routing

      ai_rules: |
        ## AI Usage Rules

        ### ✅ Allowed Scope
        - Memory retrieval algorithms
        - Embedding optimizations
        - Query builders

        ### ⚠️ Restricted Scope
        - Schema changes
        - Ingestion pipeline modifications

        ### ❌ Forbidden Scope
        - Direct database access patterns
        - Credential handling

