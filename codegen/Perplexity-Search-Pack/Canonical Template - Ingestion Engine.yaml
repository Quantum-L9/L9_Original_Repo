# ============================================================
# L9 INGESTION ENGINE — CURSOR EXTRACTION SPEC
# ============================================================
# PURPOSE:
#   Instruct Cursor (C) to generate a complete, production-grade
#   ingestion pipeline that processes historical chat transcripts
#   into L9's persistent multi-store memory system.
#
# OPERATING ASSUMPTIONS:
#   - Agent is persistent (no session handoff files)
#   - Postgres + pgvector is primary store
#   - Neo4j is structural/temporal layer
#   - Raw text is append-only, never mutated
#   - All derived data has provenance
#
# INPUT LOCATION:
#   ~/Dropbox/chat-transcripts
#
# OUTPUT:
#   New files added to repo under tools/ingest/
#
# CURSOR INSTRUCTIONS:
#   - Create files exactly as specified
#   - Do NOT invent new architecture beyond this spec
#   - Do NOT delete or refactor existing L9 code
#   - Prefer clarity and explicitness over cleverness
# ============================================================

engine_metadata:
  name: "L9 Historical Ingestion Engine"
  version: "0.1.0"
  owner: "Igor"
  mode: "offline-batch + idempotent"
  persistence: "append-only"
  safety: "no destructive writes"

# ============================================================
# SOURCE CONFIGURATION
# ============================================================
sources:
  root_path: "~/Dropbox/chat-transcripts"

  supported_formats:
    - chatgpt_json
    - slack_export_json
    - plain_text
    - markdown
    - transcript_txt

  detection_rules:
    chatgpt_json:
      match:
        - "*.json"
      required_keys: ["mapping", "messages"]

    slack_export_json:
      match:
        - "*.json"
      required_keys: ["messages", "user", "ts"]

    transcript_txt:
      match:
        - "*.txt"
      heuristic:
        - timestamps_present: true
        - speaker_labels: true

# ============================================================
# FILES TO GENERATE (REPO STRUCTURE)
# ============================================================
files_to_create:

  - path: "tools/ingest/__init__.py"
    purpose: "Ingestion engine module root"

  - path: "tools/ingest/models.py"
    purpose: "Typed dataclasses for ingestion pipeline"
    requirements:
      - SourceDocument
      - ParsedMessage
      - ExtractedFact
      - ExtractedTask
      - ExtractedDecision
      - ArtifactRef
      - IngestionReport

  - path: "tools/ingest/loader.py"
    purpose: "Filesystem loader and format detection"
    responsibilities:
      - walk source directory recursively
      - detect source type
      - yield SourceDocument objects
      - never parse content here

  - path: "tools/ingest/parsers.py"
    purpose: "Source-specific parsers"
    responsibilities:
      - parse SourceDocument -> ParsedMessage[]
      - preserve timestamps, roles, ordering
      - attach source offsets for provenance
    parsers_required:
      - parse_chatgpt_json
      - parse_slack_json
      - parse_transcript_txt
      - parse_plain_text

  - path: "tools/ingest/chunker.py"
    purpose: "Message and episode chunking"
    responsibilities:
      - message-level chunks
      - optional episode-level chunks
      - stable chunk IDs
      - configurable window size

  - path: "tools/ingest/embedder.py"
    purpose: "Asynchronous embedding writer"
    responsibilities:
      - generate embeddings
      - write to pgvector table
      - set embedding_status
      - support delayed / retryable embedding

  - path: "tools/ingest/extractor.py"
    purpose: "LLM-powered structured extraction"
    responsibilities:
      - extract facts, tasks, decisions, entities
      - attach confidence scores
      - attach derivation spans
      - never hallucinate missing data

  - path: "tools/ingest/writers.py"
    purpose: "Database writers (Postgres + Neo4j)"
    responsibilities:
      - insert messages (append-only)
      - upsert facts with temporal validity
      - insert tasks & decisions
      - sync messages/entities/events to Neo4j
      - idempotent operations only

  - path: "tools/ingest/reconciler.py"
    purpose: "Conflict and lifecycle management"
    responsibilities:
      - detect contradictory facts
      - close valid_until windows
      - flag conflicts for agent attention

  - path: "tools/ingest/ingest.py"
    purpose: "Main orchestration entrypoint"
    responsibilities:
      - coordinate all pipeline stages
      - handle batching
      - emit IngestionReport
      - support dry-run mode

# ============================================================
# DATA MODEL CONTRACTS
# ============================================================
data_contracts:

  identifiers:
    user_id: "stable UUID for Igor"
    agent_id: "l9-orchestrator"
    session_id:
      generation: "hash(source_id + conversation_id)"
    message_id:
      generation: "hash(source_id + timestamp + index)"

  provenance:
    required_fields:
      - source_file
      - source_offset_start
      - source_offset_end
      - ingestion_timestamp

# ============================================================
# POSTGRES WRITE CONTRACT
# ============================================================
postgres_targets:

  tables:
    - source_documents
    - sessions
    - messages
    - embeddings
    - facts
    - tasks
    - decisions
    - artifacts

  rules:
    - never update message content
    - all derived records reference message_id
    - facts/tasks/decisions are versioned
    - embeddings are replaceable but tracked

# ============================================================
# NEO4J WRITE CONTRACT
# ============================================================
neo4j_targets:

  nodes:
    - User
    - Agent
    - Session
    - Message
    - Entity
    - Event

  relationships:
    - (User)-[:STARTED]->(Session)
    - (Session)-[:HAS_MESSAGE]->(Message)
    - (Message)-[:MENTIONS]->(Entity)
    - (Message)-[:REALIZES]->(Event)
    - (Event)-[:INVOLVES]->(Entity)

  rules:
    - Neo4j is downstream of Postgres
    - failure to write graph must not block ingestion

# ============================================================
# EXTRACTION POLICY
# ============================================================
extraction_policy:

  extract_types:
    - fact
    - decision
    - task
    - entity
    - topic

  confidence_required: true
  allow_null_extractions: true
  hallucination_policy: "forbid"

# ============================================================
# OUTPUT & REPORTING
# ============================================================
output:

  reports:
    - ingestion_summary.json
    - conflicts_detected.json
    - skipped_files.json

  logging:
    level: "INFO"
    include_source_ids: true

# ============================================================
# CURSOR EXECUTION INSTRUCTIONS
# ============================================================
cursor_instructions:
  - "Create all files listed under files_to_create"
  - "Implement minimal but complete logic per responsibilities"
  - "Use existing L9 DB connections and config where possible"
  - "Do NOT invent new memory abstractions"
  - "Code must be readable, explicit, and testable"
  - "Leave TODO markers only where LLM prompts are required"
  - "No CLI commands generated — code only"

