version: 6.0
system: L9
module: memory_engine
name: Memory
role: Persistent Cognitive Memory Substrate
root_path: L9/memory/

integration:
  connect_to:
    - L9/core/
    - L9/agents/
    - L9/orchestration/
    - L9/world_model/
  shared_domains:
    - L9_Core
    - All_Domain_OS

description: >
  Memory v2.0 is the canonical, persistent memory engine for L9.
  It replaces session-based handoffs with continuous accumulation,
  consolidation, and retrieval of knowledge across all interactions.
  The module integrates semantic, episodic, structural, and causal memory
  using Postgres+pgvector, Neo4j, and optional hypergraph extensions.
  It supports bulk ingestion of historical transcripts and live streams.

governance:
  anchors:
    - Igor
    - L
  mode: hybrid
  human_override: true
  compliance_auditor: L9/governance/auto_audit.py
  escalation_policy: manual_review
  performance_reporting: L9/monitoring/memory_metrics.json
  audit_scope:
    - data_ingestion
    - retrieval
    - mutation
    - deletion

memory_topology:
  working_memory: redis
  episodic_memory: postgres_pgvector
  semantic_memory: postgres_pgvector
  structural_memory: neo4j
  causal_memory: neo4j_hypergraph
  long_term_persistence: postgres
  cross_agent_sharing:
    enabled: true
    layer: cognition_bus
  memory_graph_linking:
    type: temporal_hypergraph
    enable_embedding_streams: true
  update_interval_hours: 1

communication_stack:
