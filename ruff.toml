# Ruff Configuration for L9 AI OS
target-version = "py312"
line-length = 88  # Black compatibility

exclude = [
    ".git", ".venv", "venv", "__pycache__", ".pytest_cache",
    ".ruff_cache", "build", "dist", ".mypy_cache", "_pack_staging",
    ".backup",
    # Archived folders (anywhere in tree)
    "_archived",
    "**/_archived",
    "**/_archived/**",
    "*_archived*",
]

[lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF",
    "ASYNC", "S", "PT", "RET", "ARG",
]
ignore = [
    "E501",    # Line too long (formatter handles)
    "E402",    # Module level import not at top (DORA metadata pattern - ADR-0014)
    "B008",    # Function call in defaults (FastAPI Depends)
    "N802",    # Function name lowercase (LangGraph)
    "S101",    # Assert in tests
    "S104",    # Bind 0.0.0.0 (containers)
    "S105", "S106", "S107",  # Hardcoded password false positives
    "ARG001", "ARG002",  # Unused args (FastAPI/abstract)
    "S110",    # try-except-pass (common pattern for optional features)
    "S112",    # try-except-continue (common resilient loop pattern)
    "S603",    # subprocess without shell=True (safe invocations)
    "S607",    # partial executable path (controlled environments)
    "S608",    # SQL injection (parameterized queries)
    "S310",    # suspicious URL open (research/API calls)
    "S311",    # non-cryptographic random (non-security uses)
    "S108",    # hardcoded temp file (containerized)
    "S501",    # no cert validation (internal services)
    "F841",    # Unused variable (future-proofing)
    "RUF012",  # Mutable class defaults (Pydantic models)
    "SIM102",  # Collapsible if (style preference)
    "SIM117",  # Multiple with statements (style preference)
    "SIM105",  # Suppressible exception (use contextlib.suppress)
    "N806",    # Non-lowercase variable (constants in functions)
    "RUF006",  # Asyncio dangling task (needs careful review)
    "RUF001", "RUF002", "RUF003",  # Ambiguous unicode (intentional)
    "PT011",   # pytest-raises-too-broad (acceptable in tests)
    "B017",    # assert-raises-exception (acceptable in tests)
    "E741",    # Ambiguous variable name (l, O, I)
    "ASYNC109", "ASYNC221",  # Async patterns (acceptable)
    "ARG005",  # Unused lambda argument
    "B007",    # Unused loop control variable
    "S324",    # Hashlib insecure (MD5/SHA1 for non-security)
    "N801",    # Invalid class name (test mocks)
    "N815",    # Mixed case variable in class (MCP protocol)
    "N818",    # Exception suffix (existing exceptions)
    "N999",    # Invalid module name (hyphenated scripts)
    "PT012",   # Pytest raises multiple statements
    "SIM115",  # Open without context manager
    "SIM222",  # Expr or True
    "ASYNC110", "ASYNC230",  # Async patterns
    "B018", "B019", "B023", "B026", "B027",  # Various bugbear
    "RUF015",  # Unnecessary iterable allocation
    "F404",    # Late future import (DORA metadata pattern)
    "UP007",   # Non-PEP604 annotation (compatibility)
    "S307",    # Eval usage (validated input)
    "F823",    # Undefined local (conditional assignment)
    "UP038",   # isinstance union (compatibility)
    "SIM108",  # Ternary operator (readability preference)
    "RET504",  # Unnecessary assign before return (explicit is better)
]
fixable = ["ALL"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402"]
"tests/**/*.py" = ["S101", "ARG001", "ARG003", "B017", "PT011", "PT017", "F821", "F401"]
"conftest.py" = ["F401"]  # Test fixtures
".github/scripts/*.py" = ["S603", "S607"]
"scripts/**/*.py" = ["S603", "S607"]
"ci/**/*.py" = ["S603", "S607"]
"api/server.py" = ["F401"]  # Intentional import availability checks
"api/e2e_slack_audit.py" = ["F401"]  # Intentional metric imports
"api/llm.py" = ["F401"]  # Import availability check
"core/tools/registry_adapter.py" = ["F401"]  # Import for type export
"core/agents/executor.py" = ["F401"]  # Import availability check
"core/governance/session_startup.py" = ["F401"]  # Import availability check
"core/observability/*.py" = ["F401"]  # Metric imports for availability
"core/packet_envelope/*.py" = ["F401"]  # Metric imports
"memory/*.py" = ["F401"]  # Import availability checks
"email_agent/*.py" = ["F401"]  # Import availability checks
"mac_agent/*.py" = ["F401", "F821"]  # Import availability checks + optional deps
"mcp_memory/**/*.py" = ["F401"]  # Import availability checks
"orchestration/*.py" = ["F401"]  # Import availability checks
"orchestrators/**/*.py" = ["F401"]  # Import availability checks
"telemetry/*.py" = ["F401"]  # Metric imports
"world_model/**/*.py" = ["F401", "E722", "F811", "ARG004"]  # Import availability + staging code
"ir_engine/*.py" = ["S701"]  # Jinja2 autoescape for code generation (not HTML)
"core/codegen/**/*.py" = ["S701", "B904"]  # Jinja2 code generation + existing patterns
"services/symbolic_computation/**/*.py" = ["S301", "S102", "B019"]  # Pickle/exec for computation
"codegenagent/*.py" = ["F821"]  # Optional dependencies
"examples/*.py" = ["F821"]  # Example code references
"services/tool_*.py" = ["F821"]  # Optional dependencies
"domain_tensor_bridge/*.py" = ["F821"]  # Optional types

[lint.isort]
known-first-party = ["core", "api", "memory", "agents", "orchestrators", "runtime", "world_model", "tools", "workers"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
