sonar.projectKey=cryptoxdog_L9
sonar.organization=cryptoxdog
sonar.sources=.
sonar.exclusions=**/*test*.py,**/tests/**,**/*.pyc,**/site-packages/**,**/venv/**,.venv/**
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml
sonar.qualitygate.wait=true
sonar.host.url=https://sonarcloud.io

# Code Smells
sonar.python.cognitive.complexity=15
sonar.python.complexity=15

# Coverage
sonar.coverage.exclusions=**/tests/**,**/*_test.py

# Duplication
sonar.cpd.exclusions=**/tests/**
