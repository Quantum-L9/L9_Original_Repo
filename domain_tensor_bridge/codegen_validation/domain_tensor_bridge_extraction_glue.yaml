# ============================================================================
# TEST MAPPING
# ============================================================================

tests:
  test_bridge_controller:
    target: tests/domain_tensor_bridge/test_bridge_controller.py
    tests_module: agent_controller
    coverage_target: 85
    cases:
      - happy_path_packet_dispatch
      - error_handling_invalid_packet
      - routing_decision_verification
  
  test_reasoning_engine:
    target: tests/domain_tensor_bridge/test_reasoning_engine.py
    tests_module: reasoning_engine
    coverage_target: 85
    cases:
      - reasoning_modes_selection
      - confidence_thresholds
      - error_paths
  
  test_governance_integration:
    target: tests/domain_tensor_bridge/test_governance_integration.py
    tests_module: governance_bridge
    coverage_target: 90
    cases:
      - escalation_triggers
      - overrides
      - audit_logging
  
  test_memory_integration:
    target: tests/domain_tensor_bridge/test_memory_integration.py
    tests_module: memory_bridge
    coverage_target: 85
    cases:
      - redis_read_write
      - postgres_query
      - neo4j_query
      - hypergraphdb_query
  
  test_api_surfaces:
    target: tests/domain_tensor_bridge/test_api_surfaces.py
    tests_module: agent_controller
    coverage_target: 80
    cases:
      - process_packet_endpoint
      - status_endpoint
  
  test_packet_routing:
    target: tests/domain_tensor_bridge/test_packet_routing.py
    tests_module: packet_router
    coverage_target: 85
    cases:
      - route_by_type
      - route_by_domain
  
  test_tensor_coordination:
    target: tests/domain_tensor_bridge/test_tensor_coordination.py
    tests_module: tensor_coordinator
    coverage_target: 80
    cases:
      - batch_tensor_calls
      - timeout_handling
  
  test_context_enrichment:
    target: tests/domain_tensor_bridge/test_context_enrichment.py
    tests_module: context_enricher
    coverage_target: 80
    cases:
      - world_model_query
      - context_building

# ============================================================================
# ENFORCEMENT RULES
# ============================================================================

enforcement:
  security:
    - rule: "No hardcoded credentials"
    - rule: "All external calls use httpx with timeout"
    - rule: "All expressions validated before processing"
  
  memory:
    - rule: "All Redis operations go through memory_bridge"
    - rule: "All Postgres operations use env-based DSN"
    - rule: "All Neo4j operations use connection pool"
  
  governance:
    - rule: "All critical operations checked against governance policy"
    - rule: "Igor/Compliance anchors must be reachable"
    - rule: "Escalation triggers respected"
  
  testing:
    - rule: "Coverage >= 85%, pass rate >= 95%"

# ============================================================================
# QUALITY GATES
# ============================================================================

quality_gates:
  - gate: "No TODOs in generated code"
  - gate: "All imports resolvable"
  - gate: "All tests passing >= 95%"
  - gate: "Code coverage >= 85%"
  - gate: "All governance anchors reachable"
  - gate: "No circular imports"
  - gate: "Three-block system: Header Meta + Footer Meta + DORA Block"


