# =============================================================================
# L9 Platform Helm Chart - Production Environment
# =============================================================================
# Usage:
#   helm install l9-prod ./l9-platform -f values-production.yaml
# =============================================================================

global:
  environment: production
  domain: l9.ai
  storageClass: fast-ssd

api:
  replicaCount: 3
  
  image:
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rate-limit: "100"
    hosts:
      - host: api.l9.ai
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: l9-api-tls-prod
        hosts:
          - api.l9.ai
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "4000m"
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  
  env:
    LOG_LEVEL: INFO

mcpMemory:
  replicaCount: 2
  
  image:
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

postgresql:
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: fast-ssd
    
    resources:
      requests:
        memory: "4Gi"
        cpu: "2000m"
      limits:
        memory: "8Gi"
        cpu: "4000m"

redis:
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: fast-ssd
    
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

neo4j:
  persistence:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd
  
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

monitoring:
  enabled: true
  
  prometheus:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: fast-ssd
    
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    
    retention: 90d
  
  grafana:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: fast-ssd
    
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: grafana.l9.ai
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: grafana-tls-prod
          hosts:
            - grafana.l9.ai
  
  jaeger:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: fast-ssd
    
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

security:
  podSecurityPolicy:
    enabled: true
  
  networkPolicy:
    enabled: true
  
  rbac:
    create: true

backup:
  enabled: true
  schedule: "0 2 * * *"  # 2 AM daily
  retention: 30  # days
  
  postgresql:
    enabled: true
  
  neo4j:
    enabled: true

# Production-specific node affinity
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/worker
          operator: In
          values:
          - "true"
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - l9-api
        topologyKey: kubernetes.io/hostname

