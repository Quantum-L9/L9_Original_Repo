# =============================================================================
# L9 Production Docker Compose
# Version: 3.0.0 - Production-optimized configuration
#
# Usage:
#   docker-compose -f deploy/docker-production/docker-compose.production.yml up -d
# =============================================================================

version: "3.9"

services:
  # ===========================================================================
  # L9 Bootstrap (Runs once, then exits)
  # ===========================================================================
  l9-bootstrap:
    build:
      context: ../..
      dockerfile: deploy/docker-production/Dockerfile.l9-api
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-api:${VERSION:-latest}
    container_name: l9-bootstrap
    command: python -m bootstrap
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      l9-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-l9_user}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB:-l9_memory}
      REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    networks:
      - l9-network
    labels:
      - "com.l9.service=bootstrap"

  # ===========================================================================
  # L9 Main API (FastAPI Application) - Production Build
  # ===========================================================================
  l9-api:
    build:
      context: ../..
      dockerfile: deploy/docker-production/Dockerfile.l9-api
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-3.0.0}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-api:${VERSION:-latest}
    container_name: l9-api
    restart: unless-stopped
    depends_on:
      l9-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      l9-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-l9_user}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB:-l9_memory}
      MEMORY_DSN: postgresql://${POSTGRES_USER:-l9_user}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB:-l9_memory}

      # API Keys (from secrets)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      L9_API_KEY: ${L9_API_KEY}
      L9_EXECUTOR_API_KEY: ${L9_EXECUTOR_API_KEY}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Neo4j
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      # API Config
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Kernel System
      L9_USE_KERNELS: "true"

      # Feature Flags
      L9_ENABLE_LEGACY_CHAT: "false"
      L9_ENABLE_LEGACY_SLACK_ROUTER: "false"

      # Mac Agent
      MAC_AGENT_ENABLED: ${MAC_AGENT_ENABLED:-false}

      # Model Configuration
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}

      # MCP API Keys
      MCP_API_KEY_L: ${MCP_API_KEY_L:-}
      MCP_API_KEY_C: ${MCP_API_KEY_C:-}
      MCP_API_KEY: ${MCP_API_KEY:-}

      # Research/Perplexity
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}

      # Slack Adapter
      SLACK_APP_ID: ${SLACK_APP_ID:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_VERIFICATION_TOKEN: ${SLACK_VERIFICATION_TOKEN:-}
      SLACK_APP_ENABLED: ${SLACK_APP_ENABLED:-false}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}

      # Email Adapter
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_ADAPTER_SIGNING_SECRET: ${EMAIL_ADAPTER_SIGNING_SECRET:-}
      GMAIL_API_KEY: ${GMAIL_API_KEY:-}

      # Calendar Adapter
      CALENDAR_ADAPTER_ENABLED: ${CALENDAR_ADAPTER_ENABLED:-false}
      GOOGLE_CALENDAR_API_KEY: ${GOOGLE_CALENDAR_API_KEY:-}
      GOOGLE_CALENDAR_WEBHOOK_SECRET: ${GOOGLE_CALENDAR_WEBHOOK_SECRET:-}

      # Twilio Adapter
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_NUMBER: ${TWILIO_SMS_NUMBER:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
    ports:
      - "${L9_API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - l9-network
    labels:
      - "com.l9.service=api"
      - "com.l9.version=${VERSION:-3.0.0}"
      - "com.l9.environment=${ENVIRONMENT:-production}"

  # ===========================================================================
  # MCP Memory Server - Production Build
  # ===========================================================================
  l9-mcp-memory:
    build:
      context: ../..
      dockerfile: deploy/docker-production/Dockerfile.mcp-memory
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-3.0.0}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_NAMESPACE:-cryptoxdog}/l9-mcp-memory:${VERSION:-latest}
    container_name: l9-mcp-memory
    restart: unless-stopped
    depends_on:
      l9-postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app:/app/mcp_memory
      MEMORY_DSN: postgresql://${POSTGRES_USER:-l9_user}:${POSTGRES_PASSWORD}@l9-postgres:5432/${POSTGRES_DB:-l9_memory}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9002
      MCP_ENV: ${ENVIRONMENT:-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBED_MODEL: text-embedding-3-small
      GOVERNANCE_HARDENING_ENABLED: "True"
      GOVERNANCE_ENFORCEMENT_MODE: "enforce"
    ports:
      - "${MCP_PORT:-9002}:9002"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - l9-network
    labels:
      - "com.l9.service=mcp-memory"
      - "com.l9.version=${VERSION:-3.0.0}"

  # ===========================================================================
  # PostgreSQL with pgvector
  # ===========================================================================
  l9-postgres:
    image: pgvector/pgvector:pg16
    container_name: l9-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-l9_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-l9_memory}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-l9_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - l9-network
    labels:
      - "com.l9.service=postgres"

  # ===========================================================================
  # Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: l9-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - l9-network
    labels:
      - "com.l9.service=redis"

  # ===========================================================================
  # Neo4j
  # ===========================================================================
  neo4j:
    image: neo4j:5-community
    container_name: l9-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - l9-network
    labels:
      - "com.l9.service=neo4j"

  # ===========================================================================
  # Prometheus
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: l9-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - l9-network
    labels:
      - "com.l9.service=prometheus"

  # ===========================================================================
  # Grafana
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: l9-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - l9-network
    labels:
      - "com.l9.service=grafana"

  # ===========================================================================
  # Jaeger
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: l9-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:14268:14268" # Collector HTTP
      - "127.0.0.1:6831:6831/udp" # Agent UDP
    volumes:
      - jaeger_data:/badger
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - l9-network
    labels:
      - "com.l9.service=jaeger"

volumes:
  postgres_data:
    driver: local
    name: l9-postgres-data-prod
  redis_data:
    driver: local
    name: l9-redis-data-prod
  neo4j_data:
    driver: local
    name: l9-neo4j-data-prod
  neo4j_logs:
    driver: local
    name: l9-neo4j-logs-prod
  prometheus_data:
    driver: local
    name: l9-prometheus-data-prod
  grafana_data:
    driver: local
    name: l9-grafana-data-prod
  jaeger_data:
    driver: local
    name: l9-jaeger-data-prod

networks:
  l9-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
