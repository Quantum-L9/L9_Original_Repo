# =============================================================================
# L9 Docker Compose for C1 (Development/Testing)
# =============================================================================
# Version: 2.0.0 - Complete stack with all services
#
# Usage:
#   docker compose up -d                # Start all services
#   docker compose up -d --build        # Build and start
#   docker compose logs -f l9-api       # Follow API logs
#   docker compose down -v              # Stop and remove volumes
#
# This mirrors the K8s deployment but runs via docker-compose.
# For production, use the K8s manifests in manifests/ directory.
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL - Memory Substrate (PacketStore + pgvector)
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: l9_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-l9_secure_password}
      POSTGRES_DB: l9_memory
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount migrations for initialization
      - ../../migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - l9-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l9_user -d l9_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # Neo4j - Knowledge Graph
  # ===========================================================================
  neo4j:
    image: neo4j:5.15
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_secure_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - l9-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Redis - Task Queue, Caching, Pub/Sub
  # ===========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - l9-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # L9 API - Main Application
  # ===========================================================================
  l9-api:
    build:
      context: ../../../..
      dockerfile: deploy/k8s/c1/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://l9_user:${POSTGRES_PASSWORD:-l9_secure_password}@postgres:5432/l9_memory
      MEMORY_DSN: postgresql://l9_user:${POSTGRES_PASSWORD:-l9_secure_password}@postgres:5432/l9_memory
      # Neo4j
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_secure_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      # OpenAI (from host environment or .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4-turbo
      # Embedding
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-large
      # Logging
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      # Feature flags
      L9_USE_KERNELS: "true"
      L9_ENABLE_LEGACY_CHAT: "false"
      L9_ENABLE_LEGACY_SLACK_ROUTER: "false"
      MAC_AGENT_ENABLED: "false"
      # Server
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - l9_logs:/app/logs
      - l9_data:/app/data
    networks:
      - l9-network
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # MCP Memory Server
  # ===========================================================================
  mcp-memory:
    build:
      context: ../../../..
      dockerfile: deploy/k8s/c1/Dockerfile.mcp-memory
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://l9_user:${POSTGRES_PASSWORD:-l9_secure_password}@postgres:5432/l9_memory
      REDIS_URL: redis://redis:6379
      # Neo4j Graph Database (REQUIRED per ADR-0082)
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-C1_Neo4j-2026!}
      LOG_LEVEL: INFO
    networks:
      - l9-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Prometheus - Metrics Collection
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - l9-network
    depends_on:
      - l9-api

  # ===========================================================================
  # Grafana - Visualization
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - l9-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  prometheus_data:
  grafana_data:
  l9_logs:
  l9_data:

networks:
  l9-network:
    driver: bridge
