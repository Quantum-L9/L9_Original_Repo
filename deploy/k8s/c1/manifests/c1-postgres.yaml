# C1 PostgreSQL + pgvector - Memory substrate storage
# Rollback: kubectl delete -f c1-postgres.yaml
#
# CRITICAL: L9 memory substrate requires PostgreSQL with pgvector
# - Packet store (conversations, decisions, events)
# - Vector embeddings for semantic search
# - Audit trail persistence
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: l9-postgres
  namespace: l9-c1
  labels:
    app: l9-postgres
spec:
  serviceName: l9-postgres
  replicas: 1
  selector:
    matchLabels:
      app: l9-postgres
  template:
    metadata:
      labels:
        app: l9-postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: l9-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: l9-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: "l9_memory"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - l9_user
            - -d
            - l9_memory
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - l9_user
            - -d
            - l9_memory
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: l9-postgres
  namespace: l9-c1
  labels:
    app: l9-postgres
spec:
  type: ClusterIP
  selector:
    app: l9-postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
