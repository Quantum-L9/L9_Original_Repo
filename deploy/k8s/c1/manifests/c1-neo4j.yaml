# C1 Neo4j - Single replica, right-sized for 8GB server
# Rollback: kubectl delete -f c1-neo4j.yaml
#
# Changes from original:
# - Replicas: 3 → 1 (single node)
# - Memory: 6Gi → 2Gi (resource constraint)
# - Storage: fast-nvme → local-path (k3s default)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: l9-neo4j
  namespace: l9-c1
  labels:
    app: l9-neo4j
spec:
  serviceName: l9-neo4j
  replicas: 1  # Single node deployment
  selector:
    matchLabels:
      app: l9-neo4j
  template:
    metadata:
      labels:
        app: l9-neo4j
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.15
        ports:
        - containerPort: 7687
          name: bolt
        - containerPort: 7474
          name: http
        env:
        # Neo4j auth - must use 'neo4j' as username
        - name: NEO4J_AUTH
          value: "neo4j/C1_Neo4j-2026!"
        - name: NEO4J_PLUGINS
          value: '["apoc"]'
        # Disable strict config validation for APOC compatibility
        - name: NEO4J_server_config_strict__validation_enabled
          value: "false"
        # Right-sized for C1 (2GB total allocation)
        - name: NEO4J_dbms_memory_heap_initial__size
          value: "512m"
        - name: NEO4J_dbms_memory_heap_max__size
          value: "1G"  # Reduced from 4G
        - name: NEO4J_dbms_memory_pagecache_size
          value: "512m"  # Reduced from 2G
        - name: NEO4J_dbms_memory_transaction_total_max
          value: "256m"
        # Performance tuning for small instance
        - name: NEO4J_dbms_connector_bolt_thread__pool__min__size
          value: "2"
        - name: NEO4J_dbms_connector_bolt_thread__pool__max__size
          value: "10"
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "400m"
          limits:
            memory: "2Gi"
            cpu: "750m"  # Reduced to fit 4 vCPU budget
        volumeMounts:
        - name: neo4j-data
          mountPath: /data
        - name: neo4j-logs
          mountPath: /logs
        livenessProbe:
          httpGet:
            path: /
            port: 7474
          initialDelaySeconds: 60  # Neo4j needs time to start
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 7474
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: neo4j-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path  # k3s default
      resources:
        requests:
          storage: 20Gi  # Reduced from 50Gi
  - metadata:
      name: neo4j-logs
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi  # Reduced from 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: l9-neo4j
  namespace: l9-c1
  labels:
    app: l9-neo4j
spec:
  type: ClusterIP
  selector:
    app: l9-neo4j
  ports:
  - port: 7687
    targetPort: 7687
    name: bolt
  - port: 7474
    targetPort: 7474
    name: http

