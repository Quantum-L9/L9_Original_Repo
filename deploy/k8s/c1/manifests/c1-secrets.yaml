  # L9 Configuration aligned with actual codebase
  orchestrator.yaml: |
    system:
      name: "L9 AIOS - C1 Instance"
      version: "1.0.0"
      environment: "production"
      server_id: "c1-hetzner"

    # Resource-aware settings for 8GB server
    memory:
      substrate:
        # Neo4j connection
        neo4j_uri: "bolt://l9-neo4j:7687"
        neo4j_max_connection_pool_size: 25  # Reduced from 50

