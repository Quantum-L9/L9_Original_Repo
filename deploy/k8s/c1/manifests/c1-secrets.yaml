# C1 Secrets and ConfigMap
# Rollback: kubectl delete -f c1-secrets.yaml
#
# IMPORTANT: Change passwords before production deployment!
# Generate secure passwords: openssl rand -base64 32
---
apiVersion: v1
kind: Secret
metadata:
  name: l9-secrets
  namespace: l9-c1
type: Opaque
stringData:
  # Credentials tracked in .env.c1.hetzner
  # IMPORTANT: Replace placeholder values before deployment!
  neo4j-user: "neo4j"
  neo4j-password: "C1_Neo4j-2026!"
  redis-password: "C1_Redis-2026!"
  # PostgreSQL (Memory Substrate)
  postgres-user: "l9_user"
  postgres-password: "C1_Postgres-2026!"
  # MCP Memory
  mcp-api-key: ""  # Set if needed
  # Grafana (Monitoring)
  grafana-user: "C1_admin"
  grafana-password: "C1_Grafana-2026!"
  # OpenAI - MUST be set before deployment
  # Run: kubectl create secret generic openai-secret --from-literal=api-key=YOUR_KEY -n l9-c1
  # Or replace this placeholder with actual key
  openai-api-key: "REPLACE_WITH_OPENAI_API_KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: l9-config
  namespace: l9-c1
data:
  # Server identification
  SERVER_ID: "c1-hetzner-cpx32"
  SERVER_IP: "46.62.243.82"
  ENVIRONMENT: "production"
  
  # L9 Configuration aligned with actual codebase
  orchestrator.yaml: |
    system:
      name: "L9 AIOS - C1 Instance"
      version: "1.0.0"
      environment: "production"
      server_id: "c1-hetzner"
    
    # Resource-aware settings for 8GB server
    memory:
      substrate:
        # Neo4j connection
        neo4j_uri: "bolt://l9-neo4j:7687"
        neo4j_max_connection_pool_size: 25  # Reduced from 50
        
        # PostgreSQL (if added later)
        postgres_pool_size: 10
        
        # Redis
        redis_host: "l9-redis"
        redis_port: 6379
        redis_max_connections: 50  # Reduced from 100
    
    agents:
      executor:
        max_concurrent_tasks: 5  # Conservative for 8GB
        task_timeout_seconds: 300
        memory_limit_per_task_mb: 512
    
    orchestration:
      unified_controller:
        enabled: true
        max_parallel_plans: 3
    
    observability:
      prometheus:
        enabled: true
        port: 9000
        scrape_interval: 30s
      logging:
        level: INFO
        format: json
    
    # Limits for resource-constrained environment
    limits:
      max_agents: 100  # Reduced from 10000
      max_memory_packets_per_minute: 500
      max_tool_calls_per_minute: 100
