apiVersion: v1
kind: ConfigMap
metadata:
  name: l9-config
  namespace: l9-c1
data:
  # Server identification
  SERVER_ID: "c1-hetzner-cpx32"
  SERVER_IP: "46.62.243.82"
  ENVIRONMENT: "production"

  # ==========================================================================
  # Governance
  # ==========================================================================
  GOVERNANCE_HARDENING_ENABLED: "True"
  GOVERNANCE_ENFORCEMENT_MODE: "enforce"

  # ==========================================================================
