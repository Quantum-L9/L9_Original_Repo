events {
    worker_connections 1024;
}

# =============================================================================
# TCP STREAM PROXYING — External access to databases
# =============================================================================
# Exposes internal Docker services on external ports:
#   PostgreSQL: 0.0.0.0:30432 -> l9-postgres:5432
#   Neo4j HTTP: 0.0.0.0:30474 -> neo4j:7474
#   Neo4j Bolt: 0.0.0.0:30687 -> neo4j:7687
#   Redis:      0.0.0.0:30379 -> redis:6379
# =============================================================================
stream {
    # PostgreSQL - Memory Substrate
    upstream postgres_backend {
        server l9-postgres:5432;
    }
    server {
        listen 30432;
        proxy_pass postgres_backend;
    }

    # Neo4j HTTP Browser
    upstream neo4j_http_backend {
        server neo4j:7474;
    }
    server {
        listen 30474;
        proxy_pass neo4j_http_backend;
    }

    # Neo4j Bolt Protocol
    upstream neo4j_bolt_backend {
        server neo4j:7687;
    }
    server {
        listen 30687;
        proxy_pass neo4j_bolt_backend;
    }

    # Redis - Cache/Queue
    upstream redis_backend {
        server redis:6379;
    }
    server {
        listen 30379;
        proxy_pass redis_backend;
    }
}

http {
    upstream l9_api {
        server l9-api:8000;
    }

    server {
        listen 80;
        server_name l9.quantumaipartners.com;

        location / {
            proxy_pass http://l9_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # L9 MCP memory – exposed at /memory/
        location /memory/ {
            proxy_pass http://l9-mcp-memory:9002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
